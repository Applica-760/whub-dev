schema_version: 1
task:
  id: TASK-032
  state: in_progress
  title: 任意タイミングのDaily追記をInbox Widgetへ統合
  objective: 感じた時点の思考・感情を日末まで記憶せず低負担で残せるよう、Overviewの既存Inbox Widgetから当日のvault/dailyへ時刻付き生ログを追記できるようにする
  approach:
  - Daily入力は強制通知や定時要求を行わず、利用者が任意タイミングで本文だけを送信する
  - 実行時のローカル日時からvault/daily/YYYY-MM-DD.mdを決定し、HH:MMの時刻見出しと入力本文を既存内容を壊さず追記する
  - InboxとDailyは保存契約が異なるためservice/APIを分離し、UIフォームとWidgetFrameだけを共通化する
  - OverviewではWidgetFrameを増やさず、Inbox/Daily切替を配置してモード別の入力状態・検証・結果表示を保持する
  - Agentic分析・日次要約・活動量スコア・明示的な日付変更・CLI入力は本Taskの対象外とし、蓄積後の別Taskで検討する
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
