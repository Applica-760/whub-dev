    statement: 送信時のローカル日付に対応するvault/daily/YYYY-MM-DD.mdへ、HH:MMの見出しと入力本文が既存内容を失わず追記される
  - id: ACC-003
    statement: 同日中の複数投稿は順序どおり蓄積され、日付が変われば別のDailyファイルへ保存される
  - id: ACC-004
