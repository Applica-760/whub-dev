  - id: ACC-005
    statement: InboxとDailyの入力状態・必須項目・送信結果がモード別に管理され、切替操作による入力消失や誤投函を防げる
  - id: ACC-006
    statement: 新規Dailyはvault規約に沿う最小frontmatterを持ち、既存形式のDailyにも破壊的変更なく追記できる
  - id: ACC-007
