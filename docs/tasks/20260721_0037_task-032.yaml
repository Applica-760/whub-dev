    statement: Dailyモードは通知や定時入力を要求せず、任意タイミングで空白でない複数行本文を送信できる
  - id: ACC-002
    statement: 送信時のローカル日付に対応するvault/daily/YYYY-MM-DD.mdへ、HH:MMの見出しと入力本文が既存内容を失わず追記される
  - id: ACC-003
    statement: 同日中の複数投稿は順序どおり蓄積され、日付が変われば別のDailyファイルへ保存される
  - id: ACC-004
    statement: Overviewには単一のWidgetFrameだけが置かれ、その内部でInbox/Dailyを明確に切り替えられ、Inboxの既存投函動作が維持される
  - id: ACC-005
    statement: InboxとDailyの入力状態・必須項目・送信結果がモード別に管理され、切替操作による入力消失や誤投函を防げる
  - id: ACC-006
    statement: 新規Dailyはvault規約に沿う最小frontmatterを持ち、既存形式のDailyにも破壊的変更なく追記できる
  - id: ACC-007
    statement: Agentic分析・日次要約・活動量スコア・明示的な日付変更・CLI入力が本Taskへ混入していない
  - id: ACC-008
    statement: backend/frontend testsとfrontend buildが成功し、実画面でOverviewの占有面積増加がないことを確認できる
  - id: ACC-009
    statement: DailyはInboxと独立した直接入力を受け付け、時系列の生ログとしてvault/dailyに保存される
  - id: ACC-010
    statement: Dailyモードは任意の元気度1〜5を保存でき、未記録の投稿と既存Dailyを破壊せず扱える
