schema_version: 1
task:
  id: TASK-032
  state: in_progress
  title: 任意時刻のDaily追記と元気度記録をInbox Widgetへ統合
  objective: 感じた時点の思考・感情を日末まで記憶せず低負担で残せるよう、Overviewの既存Inbox Widgetからvault/dailyへ時刻付き生ログと任意の元気度を追記できるようにする
  approach:
  - DailyはInboxと独立した時系列の生ログとして扱い、利用者が任意タイミングで本文だけを送信する
  - '実行時のローカル日時からvault/daily/YYYY-MM-DD.mdを決定し、tags: [Daily]のfrontmatterを持つ新規ファイルへHH:MM見出しと入力本文を追記する'
  - 元気度は任意の単一指標1〜5で記録し、未記録を許容する
  - InboxとDailyは保存契約が異なるためservice/APIを分離し、UIフォームとWidgetFrameだけを共通化する
  - Agentic分析・日次要約・活動量スコア・明示的な日付変更・CLI入力は本Taskの対象外とする
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
