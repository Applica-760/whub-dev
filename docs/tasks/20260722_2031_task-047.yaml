plan:
  acceptance: []
  phases:
  - title: 0.1.0+g2b791026リリース作成の実行ログ
    acceptance: []
    steps:
    - description: whub app実行時に「web app distribution is missing」が発生。packaged_app_dist()がwheel内のwebapp/dist/index.htmlを要求するが、稼働中release
        0.1.0+g04b4926dのwheelにはwebapp/distが同梱されておらず、src/whub/webapp/dist自体も生成されていなかった（app/distも同様に未生成）。npm
        run buildが一度も実行されないままwheel化・リリースされていたことが原因と判明。
      state: done
      skip_reason: null
      deleted: false
    - description: app/でnpm run buildを実行したところ、Cannot find module '@rollup/rollup-darwin-arm64'で失敗（npm
        optional depsの既知バグ、npm/cli#4828）。node_modulesのみ削除しpackage-lock.jsonは残したままnpm
        installを再実行したところ解消し、ビルドが通った。
      state: done
      skip_reason: null
      deleted: false
    - description: wheelをビルドして展開したところ、whub --versionが古いコミット(aa8c380b)を報告することに気づいた。src/whub/_build.json(.gitignore対象の生成物)が前回リリース時のsource_commitのまま残っており更新されていなかったのが原因。現HEAD(2b791026)へ手動で書き換えてから再度uv
        build --wheelしたところ、正しいコミットがwhub --versionに反映された。
      state: done
      skip_reason: null
      deleted: false
    - description: 新規releaseのvenvをuv venvで作成し、python -m pip install <wheel>を試したところNo
        module named pipで失敗。uv venvが作る仮想環境にはpipが同梱されないため、代わりにuv pip install --python
        venv/bin/python <wheel>を使ったところ、依存込みで正常にインストールできた。
      state: done
      skip_reason: null
      deleted: false
    - description: currentシンボリックリンクの切替でln -sfn current.tmp && mv -T current.tmp currentを試みたところ、macOSのBSD
        mvには-Tオプションがなくillegal optionで失敗（GNU coreutils固有オプションのため）。代わりにPythonのos.replace('current.tmp',
        'current')でsymlinkをatomicに置換したところ成功した。
      state: done
      skip_reason: null
      deleted: false
    - description: current切替後にPATH上のwhub --versionを確認したところ、旧release(0.1.0+g04b4926d)のコミットのままだった。which
        whubで実体を確認すると、このシェルセッションのPATHがcurrent経由ではなく旧releaseの絶対パスに直接固定されていたことが判明。releases/current/venv/bin/whubを直接呼ぶと新releaseが正しく解決されることを確認し、新しいターミナルセッションを開けば反映される旨をユーザーへ報告した。
      state: done
      skip_reason: null
      deleted: false
    log:
    - release 0.1.0+g2b791026作成時の実行ログ。(1)webapp/dist欠落によるwhub appのAppResourceError発生と原因特定、(2)npm
      optional depsバグでのnpm run build失敗とnode_modules再インストールによる解消、(3)_build.jsonのsource_commit更新漏れとwhub
      --version誤表示、(4)uv venvにpipが同梱されずuv pip install --pythonでの代替、(5)BSD mvの-T非対応とos.replace()によるcurrent
      symlinkのatomic切替、(6)current切替後もシェルPATHが旧release絶対パスに固定され新ターミナルが必要だった事象。いずれも0.1.0+g2b791026の1回の実行で遭遇した実例であり、汎用手順としてではなく個別事象の記録として残す。
    - 運用契約をdocs/operations/releace.mdへ記載。以後のwhub release実装は同契約を正本とする。
    deleted: false
