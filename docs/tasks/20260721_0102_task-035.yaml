schema_version: 1
task:
  id: TASK-035
  state: in_progress
  title: Bootを廃止しProject Agent設定とCodeGraphを再編する
  objective: Agentの入口をhubへ統一し、各Projectが固有AGENTS.mdだけを管理する運用へ移行した上で、Bootを廃止してCodeGraph初期化を独立コマンドへ移し、配布済み共通ルール・Skillとpackage
    asset配置を整理する
  approach:
  - hubのAGENTS.mdとCLAUDE.mdへ対象Project直下のAGENTS.mdを作業前に必ず読む契約を置き、共通ルールとSkillはhubだけで管理する
  - resourceのboot flagをcodegraph flagへ改名し、whub codegraphがcodegraph有効ProjectだけをlocalまたはremoteでCodeGraph初期化する
  - 各Project固有の指示とSkillを保護しながら、Bootが配布した共通ルール・共通Skill・Agent関連Ignoreだけを撤去する
  - Boot assetを削除し、残るSession launcherはsrc/whub/assets配下へ移して開発ツリーとwheelで検証する
  depends_on:
  - TASK-042
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
