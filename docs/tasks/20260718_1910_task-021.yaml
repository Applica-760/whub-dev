  title: OverviewのProject別ビューと共通フロント部品を再設計する
  objective: OverviewでProjectを切り替え、選択ProjectのTask一覧・Task関係グラフ・Backlogを共通の選択UIから一貫して表示できるようにする
  approach:
  - OverviewPageで1つのProject選択状態と横長のProjectタブを管理し、Task一覧・Task関係グラフ・Backlogへ適用する
  - TaskのWeb閲覧をProject単位にし、Project間でTask IDが重複しても一覧・グラフ・詳細を正しく識別する
  - Todo・Inbox・StatusはProject選択の対象外とし、既存のBacklog・Task専用ページとナビゲーションを維持する
  - 共通Projectタブと既存WidgetをOverview・専用ページで再利用し、Vaultは対象外とする
  depends_on:
  - TASK-020
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
