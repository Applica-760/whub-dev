      state: pending
      skip_reason: null
      deleted: false
    - description: '方針メモ: もともと運用fileをhome配下ではなくworkspace-hub自体へ集約したのは、ファイルの状態をエディタで確認できるようにするためだった。現在はWhub
        Web appが整備されており、manifestの実内容とparse errorを表示するfrontendを用意すればSSoTの状態を間接的に確認できる。そのためoperation
        root/.whub維持にはこだわらず、home配下の固定user directoryへ移してよい。TASK作成時approachの『operation
        root/.whub直下のまま維持』はこの補正方針で置き換える。'
      state: pending
      skip_reason: null
      deleted: false
    - description: manifest.yaml・todos.yaml・downloads等を固定user directoryへ移行し、data_dir・dual-read・operation
        root依存を復活させず全consumerを切り替える。
      state: pending
      skip_reason: null
      deleted: false
    - description: whubとwflowをMac内の任意directoryから実行して同じcontextを選ぶことを検証し、開発・test用の別contextは明示指定だけで選択できるようにする。
      state: pending
      skip_reason: null
      deleted: false
    - description: Web appでmanifestの実内容とparse errorを確認できる画面を設け、ファイルをworkspace-hub配下に置かなくても運用状態を観測できることを検証する。
      state: pending
      skip_reason: null
      deleted: false
    - description: 関連test・smoke test・Knowledge更新を完了し、旧context探索と移行元データを安全に終了する。
      state: pending
      skip_reason: null
      deleted: false
    log: []
    deleted: true
  - title: 固定user context契約を実装する
    acceptance: []
    steps:
    - description: WhubContextを直接context directoryを表すモデルへ変更し、既定を~/.whub、workspace
