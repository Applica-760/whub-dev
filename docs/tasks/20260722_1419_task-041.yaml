schema_version: 1
task:
  id: TASK-041
  state: in_progress
  title: Whub operation contextを~/.whubへ固定する
  objective: Whub所有データ・runtime・releaseを~/.whubへ集約し、cwdとlogical PWDに依存する親探索を廃止して、Mac内のどのdirectoryからも一意のoperation
    contextを解決できるようにする
  approach:
  - 通常運用では~/.whubを唯一の既定contextとして使用する。
  - Project resourceを配置するworkspace rootはconfigで明示し、operation dataの保存先から分離する。
  - 開発・testで別contextが必要な場合だけCLI optionで明示指定し、cwd・symlink・親directoryから暗黙推定しない。
  - manifest.yaml・todos.yaml・downloads・runtime・releasesを~/.whubへ一度だけ移し、data_dir・dual-readを復活させない。
  depends_on:
  - TASK-044
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: 通常のwhubとwflowはcwdやlogical PWDに依存せず~/.whubを唯一の既定contextとして使用し、workspace_rootはconfigで明示される。
  - id: ACC-003
    statement: manifest・todos・downloads・releases・PID・backupsを含むoperation dataが~/.whubへ一度だけ移行され、旧workspace-hub/.whubは残らず、移行前後の内容が照合されている。
  - id: ACC-004
    statement: 通常CLIとWeb appが~/.whub/releasesの検証済み非editable releaseから動作し、workspace
      rootのStable .venvも同releaseを指す。
  - id: ACC-005
    statement: Web appでmanifest全文とparse errorをread-only表示でき、manifest不正時にも内容とerrorを確認できる。
  - id: ACC-006
    statement: 関連するbackend/frontend test、build、smoke test、Knowledge検証が成功し、旧context前提が残っていない。
  - id: ACC-007
    statement: CLIはcontext切替optionを持たず、親探索・環境変数override・data_dir・dual-readを使用しない。開発・testの分離contextはWhubContextの直接注入だけで扱える。
