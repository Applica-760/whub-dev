schema_version: 1
task:
  id: TASK-041
  state: draft
  title: Whub operation contextを~/.whubへ固定する
  objective: Whub所有データ・runtime・releaseを~/.whubへ集約し、cwdとlogical PWDに依存する親探索を廃止して、Mac内のどのdirectoryからも一意のoperation
    contextを解決できるようにする
  approach:
  - 通常運用では~/.whubを唯一の既定contextとして使用する。
  - Project resourceを配置するworkspace rootはconfigで明示し、operation dataの保存先から分離する。
  - 開発・testで別contextが必要な場合だけCLI optionで明示指定し、cwd・symlink・親directoryから暗黙推定しない。
  - manifest.yaml・todos.yaml・downloads・runtime・releasesを~/.whubへ一度だけ移し、data_dir・dual-readを復活させない。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
