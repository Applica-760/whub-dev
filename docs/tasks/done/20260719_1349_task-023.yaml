schema_version: 1
task:
  id: TASK-023
  state: completed
  title: 全Projectの残存Markdown TaskをYAMLへ移行する
  objective: manifest配下の全Projectに残る未完了Markdown Taskを、既存の計画・意思決定・実行事実を保持したYAML Taskへ移行し、YAMLを実行記録のSSOTに統一する
  approach:
  - 全Projectを再棚卸しし、docs/tasks/done配下の完了済みMarkdownは凍結履歴として対象外にする
  - 各Markdown Taskはwflow task initで同一Project内にYAMLを新設し、計画・完了Step・実行ログ・残作業を移して検証する
  - 移行元Markdownは削除せずYAMLへの参照を付けた凍結履歴とし、以後の更新先をYAMLだけにする
  depends_on: []
  interruption_task_id: TASK-029
  interruption_reason: mount済みremoteでAppleDoubleがProjectファイル探索を破壊し、Markdown Task移行を継続できないため
  interruption_source_task_id: null
plan:
  acceptance: []
  phases:
  - title: 移行対象を着手時に確定する
    acceptance: []
    steps:
    - description: manifest Projectのうち現在アクセス可能なProjectを対象に、着手時点のdocs/tasks配下にあるMarkdown
        Taskを再走査し、Taskがないesn-lab-runはユーザー確認に基づく対象外としてPhase logへ記録する
      state: done
      skip_reason: null
      deleted: false
    - description: 各Markdownを内容と配置に基づいて未完了の移行対象または完了済みの凍結履歴へ分類し、Project別の対象一覧をPhase
        logへ記録する
      state: done
      skip_reason: null
      deleted: false
    log:
    - '2026-07-20 棚卸し: 現在アクセス可能な12 Projectを走査。esn-lab-runはTaskなしというユーザー確認により対象外。活動中Markdownはsns-lab
      1件（20260526_0056_chat-ui-polish.md）、la-imitation-learning 3件（20260708_1230_hilserl_sq_only_termination.md、20260618_1030_dsrl_implementation.md、20260711_1157_hilserl_action_scale_fix.md）を移行対象とした。esn-labの2件（20260511_1500_judge_strategy.md、20260604_1904_pred_analysis_tool.md）は計画済み項目が全完了し後続を別Taskとして明記しているため完了済み凍結履歴に分類。その他Projectに活動中Markdownなし。'
    deleted: false
  - title: ProjectごとにYAML Taskへ移行する
    acceptance: []
    steps:
    - description: 各移行対象について同一Projectでwflow task initを実行し、移行元MarkdownのProject相対リンクをYAML
        Taskのapproachへ追加する
      state: done
      skip_reason: null
      deleted: false
    - description: 元Markdownの目的・方針・意思決定・Phase・Step・実行ログ・結果を、推測で補完せずYAMLの対応項目へ移す
      state: done
      skip_reason: null
      deleted: false
    - description: 再構成したTaskごとに計画と状態の対応をユーザーへ提示し、承認後に既完了Stepと残作業をwflowで反映する
      state: done
      skip_reason: null
      deleted: false
    log:
    - '2026-07-20 移行中断: sns-lab TASK-001 draftは再構成済み。la-imitation-learning TASK-001（DSRL）を作成して計画挿入中、remote
      mountがAppleDouble sidecar docs/tasks/._20260720_1417_task-001.yamlを生成。wflowのTask探索が全*.yamlをUTF-8として読むためUnicodeDecodeErrorで停止した。DSRL
      draftはPhase 1途中まで有効。根本修正の判断待ち。'
    - '2026-07-20 AppleDouble修正後に移行先draft 4件を作成・検証: sns-lab TASK-001（20260526_0056_chat-ui-polish.md）、la-imitation-learning
      TASK-001（20260618_1030_dsrl_implementation.md）、TASK-002（20260708_1230_hilserl_sq_only_termination.md）、TASK-003（20260711_1157_hilserl_action_scale_fix.md）。全Taskに移行元Project相対pathをapproachとして記録し、wflow
      task check成功。'
    - 4件の状態対応をユーザー承認後に反映。全Taskをin_progressへ移行。sns-lab TASK-001はPhase 1〜5完了・Phase 6残、IL
      TASK-001は全Step未完了、TASK-002はPhase 1〜3完了・Phase 4残、TASK-003はPhase 1〜2とPhase 3先頭3
      Step完了・残作業維持。元Markdownの実行ログ空欄/なしも明記し、TASK-002の試行1〜6・引き継ぎ・運用注意、TASK-003の実測・検証結果・追加デモ注意を対応Phase
      logへ移した。4件すべてwflow task check成功。
    deleted: false
  - title: 移行元Markdownを凍結する
    acceptance: []
    steps:
    - description: 移行先YAMLをwflow task checkで検証し、YAMLがSSOTになったことを確認する
      state: done
      skip_reason: null
      deleted: false
    - description: 移行元Markdownの本文を保持したまま移行先YAMLへのProject相対リンクを付け、以後更新しない凍結履歴として明示する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 移行元Markdown 4件のタイトル直後へ、本文を保持したまま移行先YAMLのProject相対path表示・兄弟file link・以後更新しない凍結履歴の明示を追加。sns-lab→TASK-001、IL
      DSRL→TASK-001、s/q-only→TASK-002、action scale→TASK-003。
    deleted: false
  - title: 対象Projectの移行結果を検証する
    acceptance: []
    steps:
    - description: 対象Projectを再走査し、未移行の活動中Markdown Taskが残っていないことと完了済みMarkdownが変更されていないことを確認する
      state: done
      skip_reason: null
      deleted: false
    - description: 作成した全YAMLのwflow task check結果とProject別の移行結果をPhase logへ記録する
      state: done
      skip_reason: null
      deleted: false
    log:
    - '対象Project再走査結果: migrated-frozenはsns-lab 1件・la-imitation-learning 3件、completed-historyはesn-lab
      2件、unmigrated-activeは0件。esn-lab完了済みMarkdown 2件はgit diff --exit-code成功で無変更を確認。'
    - 移行先4 YAMLは全てwflow task check成功、全てin_progress。Markdownリンク先4 fileの存在確認、sns-lab/ILの対象差分はタイトル直後の凍結表示追加のみ、各repositoryのgit
      diff --check成功。
    deleted: false
