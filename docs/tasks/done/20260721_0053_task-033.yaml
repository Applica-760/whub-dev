schema_version: 1
task:
  id: TASK-033
  state: completed
  title: フロントエンド・Pythonのフォーマッタとpre-commit検査を導入する
  objective: フロントエンドとPythonのコードについて、commit前にフォーマット不整合を検出できる状態にする
  approach:
  - 対象はフロントエンドとPythonとし、各言語へフォーマッタを導入する。
  - pre-commitではフォーマット検査を実行し、commit前に不整合を検出する。
  - 今回の範囲はフォーマッタ導入とpre-commitによるフォーマット検査に限定し、Linter・CI・Agentコードレビューは含めない。
  - 具体的なフォーマッタは未決定とし、既存構成を確認した上で選択肢とトレードオフを提示して承認を得る。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: Ruff formatterで対象Pythonコードを整形・検査でき、Ruff Linterが有効化されていない。
  - id: ACC-002
    statement: Prettierでapp/の対象コードを整形・検査でき、slides/とapp/src/api/generated/が対象外である。
  - id: ACC-003
    statement: pre-commitが対象のstagedファイルをcheck-onlyで検査し、未整形時に内容とindexを変更せず失敗し、整形済みなら成功する。
  - id: ACC-004
    statement: 一括整形後にuv run pytest、app/のtypecheck・test・buildがすべて成功する。
  - id: ACC-005
    statement: Linter・CI・AgentコードレビューおよびWorktree固有のWhub対応が本Taskへ追加されていない。
  phases:
  - title: フォーマッタ設定と対象範囲の確定
    acceptance: []
    steps:
    - description: PythonのフォーマッタとしてRuff formatterを導入し、Ruff Linterは今回有効化しない。
      state: done
      skip_reason: null
      deleted: false
    - description: フロントエンドのフォーマッタとしてPrettierをapp/へ導入し、slides/とapp/src/api/generated/を対象外にする。
      state: done
      skip_reason: null
      deleted: false
    - description: RuffとPrettierは原則として既定設定を用い、対象と除外に必要な最小限の設定だけを追加する。
      state: done
      skip_reason: null
      deleted: false
    log:
    - Ruff 0.15.22とPrettier 3.9.5を導入した。Ruff Linterは設定せず、Prettierはapp/のみを対象としてdist/・openapi.json・src/api/generated/を除外した。check-only実行でRuffは110ファイル、Prettierは59ファイルをPhase
      2の整形対象として検出し、生成物がignoredであることを確認した。npm installはhigh severity 2件を報告したが、本Task範囲外のためaudit
      fixは適用していない。
    - formatter実行で生成されるrepository local cacheとして.ruff_cache/を.gitignoreへ追加した。.pytest_cache・__pycache__・app/node_modules・app/distは既存設定でignore済み、pre-commit
      cacheはrepository外のユーザーcacheを使用するため追加不要と確認した。
    deleted: false
  - title: 既存コードの一括整形と検証
    acceptance: []
    steps:
    - description: 対象のPythonコードとapp/のフロントエンドコードを各フォーマッタで一括整形する。
      state: done
      skip_reason: null
      deleted: false
    - description: uv run pytestとapp/のnpm run typecheck、npm test、npm run buildを実行し、整形後も既存の検証が成功することを確認する。
      state: done
      skip_reason: null
      deleted: false
    - description: 検証成功後、既存コードのフォーマット変更だけを独立したcommitとして記録する。
      state: done
      skip_reason: null
      deleted: false
    log:
    - RuffでPython 110ファイル、Prettierでapp 59ファイルを整形し、生成物・slidesに差分がないことを確認した。ruff format
      --checkは137ファイル、prettier --checkは全対象で成功した。uv run pytestは339件成功、appはtypecheck、Vitest
      4 files/13 tests、production buildが成功した。フォーマット差分169ファイルのみをcommit 67fa25e3として記録した。
    deleted: false
  - title: pre-commitフォーマット検査の導入
    acceptance: []
    steps:
    - description: repository rootへpre-commit frameworkを導入し、Pythonとapp/の対象ファイルにフォーマット検査を設定する。
      state: done
      skip_reason: null
      deleted: false
    - description: pre-commitはcheck-onlyとし、未整形ファイルの自動編集や自動stageを行わない。
      state: done
      skip_reason: null
      deleted: false
    - description: 整形済みのstagedファイルでは検査が成功し、未整形のstagedファイルでは内容とindexを変更せず検査が失敗することを実証する。
      state: done
      skip_reason: null
      deleted: false
    - description: Worktree固有のWhub対応は依存先TASK-034の検討範囲とし、本Taskへ含めない。
      state: done
      skip_reason: null
      deleted: false
    log:
    - pre-commit 4.6.0をrootへ導入し、Ruff 0.15.22公式hookとappのPrettier 3.9.5 local hookをcheck-onlyで設定した。全ファイル検査は両hook成功。未整形staged
      probeではPython hash a02516854499e3c87467c9e1abb7487f24f85cad、TypeScript hash
      586a68cca25a6246a469a4ecc47a2b9ddc44ddcdがhook実行前後のworking fileとindexで一致し、自動編集・自動stageなしで失敗した。整形済みstaged
      probeでは両hook成功。probeは除去済み。Worktree固有変更は行っていない。
    deleted: false
