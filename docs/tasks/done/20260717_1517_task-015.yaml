- acceptance: ACC-002
  status: passed
  evidence:
  - SSH終了コード伝播と例外時復旧を自動テストで確認した。
- acceptance: ACC-003
  status: passed
  evidence:
  - 実TTYでtmux接続を終了後、矢印キーとスクロールが正常に動作することをユーザーが確認した。
- acceptance: ACC-004
  status: passed
