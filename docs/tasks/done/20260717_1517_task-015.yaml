schema_version: 1
task:
  id: TASK-015
  state: completed
  title: whub cd後の端末状態を復旧し、whub app devの起動不全を診断する
  objective: whub cdで起動したtmuxまたはSSHの終了後、ローカル端末に残留しうる入力モードを安全に解除し、通常のシェル操作を維持する。また、whub
    app devの起動不全を端末復旧とは独立して再現・診断する
  approach:
  - os.execvpをsubprocess.runへ置換し、SSH終了後に後処理を実行可能にする
  - tmuxが有効化しうる既知の端末モードだけを解除し、stty saneなどユーザー設定を変更する復旧は行わない
  - SSH終了コードの伝播と端末復旧出力をテストし、実TTYで受け入れ確認する
  - whub app devの起動過程・子プロセス・ポートを観測し、失敗出力を根拠として原因を特定する
  - 通常モードと開発モードのポート、PID記録、停止操作を分離し、同時起動できるようにする
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: tmuxを使うwhub cdのSSH終了後、既知のマウス・アプリケーションカーソルモードを解除し、ユーザーのtermios設定を変更しない
  - id: ACC-002
    statement: SSHの正常終了・異常終了で終了コードを維持し、端末復旧後にwhub cdが終了する
  - id: ACC-003
    statement: 実TTYでtmux接続を終了した後、矢印キーとスクロールがローカルシェルで正常に使えることを確認する
  - id: ACC-004
    statement: whub app devの起動不全を端末復旧とは独立して再現し、Vite・API・プロセス管理・実行環境のいずれに起因するかを根拠とともに記録する
  - id: ACC-006
    statement: 通常モードは8710、開発モードはViteを8712・APIを8713で待受し、両モードを同時に起動できる
  - id: ACC-007
    statement: 通常モードと開発モードのPID記録および停止操作は独立し、一方を停止しても他方を停止・削除しない
  phases:
  - title: 復旧対象と実装契約を確定する
    acceptance: []
    steps:
    - description: tmuxが有効化しうる端末モードと解除シーケンスを確認し、whubが解除する既知モードを定義する
      state: done
      skip_reason: null
      deleted: false
    - description: subprocess.runへの置換、例外時を含む後処理、SSH終了コード伝播の契約を定義する
      state: done
      skip_reason: null
      deleted: false
    log:
    - whub cdはtmuxのmouseを有効化する。tmuxの終了処理に合わせ、mouse (1000/1002/1003/1005/1006)、bracketed
      paste (2004)、focus reporting (1004)、application keypad/cursor (rmkx相当)、alternate
      screen (rmcup相当) の解除だけを対象とする。stty sane・termios変更・画面消去は行わない。
    - '実装契約: _cd_remoteはsubprocess.run(cmd)でSSHを標準入出力継承のまま起動し、戻り値をそのままsys.exitへ渡す。runの正常終了・OSError・KeyboardInterruptを含めfinallyで復旧する。stdoutがTTYでない場合は既存どおりSSHを起動せずEXIT_SSH
      (100) で終了し、復旧出力も行わない。'
    - 復旧処理は既知の端末エスケープシーケンスをstdoutへ出力してflushするだけとし、termios・ユーザーの端末設定・画面内容には触れない。
    deleted: false
  - title: SSH終了後の端末復旧を実装する
    acceptance: []
    steps:
    - description: _cd_remoteをsubprocess.runでSSHを実行する実装へ変更し、終了後に限定した端末復旧を行う
      state: done
      skip_reason: null
      deleted: false
    - description: SSH終了コードを維持し、非TTY時の既存動作を維持する
      state: done
      skip_reason: null
      deleted: false
    log:
    - cd.pyでos.execvpをsubprocess.runへ置換した。SSH終了後または例外伝播時に、既知のmouse・focus・bracketed
      paste・application keypad/cursor・alternate screen解除シーケンスをstdoutへflushする。
    - SSHの戻り値はsys.exitへそのまま渡し、非TTY判定はSSH起動前に維持した。復旧出力はTTY判定通過後のfinallyに限定した。構文解析とgit
      diff --checkは成功した。
    deleted: false
  - title: テストと実TTYで検証する
    acceptance: []
    steps:
    - description: SSH起動、終了コード伝播、端末復旧出力、非TTY時の挙動を自動テストする
      state: done
      skip_reason: null
      deleted: false
    - description: tmuxセッションのdetachとSSH切断後に、矢印キーとスクロールが正常に使えることを実TTYで確認する
      state: done
      skip_reason: null
      deleted: false
    - description: 関連テストとwflow task checkを実行する
      state: done
      skip_reason: null
      deleted: false
    log:
    - test_cd.pyにTTYでのSSH起動、終了コード23の伝播、復旧シーケンス出力とflush、OSError時のfinally復旧、非TTY時にSSHを起動しないケースを追加した。対象テスト8件は成功した。
    - uv run pytestは274 passed、wflow task check 015はvalid。Ruffは開発依存に含まれず実行できなかったため、構文解析とgit
      diff --checkで補完した。
    - ユーザーが実TTYでtmux detach後に矢印キーとマウススクロールが正常であることを確認した。
    deleted: false
  - title: whub app devの起動不全を独立して診断する
    acceptance:
    - id: ACC-005
      statement: 診断中に起動したプロセスを停止し、既存のapp PID記録とポートを診断前の状態へ戻す
    steps:
    - description: whub app devの起動前提、PID記録、8710・8711ポート、および既存プロセスを確認する
      state: done
      skip_reason: null
      deleted: false
    - description: 出力を観測可能な条件で起動を再現し、ViteとAPIの各子プロセスの終了状態・失敗出力を採取する
      state: done
      skip_reason: null
      deleted: false
    - description: 観測結果から原因と影響範囲を記録し、修正が必要な場合は最小の修正案と検証条件を提示する
      state: done
      skip_reason: null
      deleted: false
    - description: 診断で起動したプロセスを停止し、PID記録とポートが残留していないことを確認する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 通常モードのapp.pidはPID 46595・8710を記録し、whub app devはmodeを区別せず既存PIDがあるため起動しない。8711にはPID記録にないuvicorn
      reload子プロセスが残留していた。Node/npm/node_modulesと通常サーバーのhealthは正常だった。
    - 通常モードを起動せず、whub app devを8712/8713で実起動した。Vite経由のhttp://127.0.0.1:8712/api/healthは正常応答し、app-dev.pidにはrunner・API・ViteのPIDが記録された。
    - 起動阻害の直接原因は、devが通常モードと同じapp.pid・8710を参照していたこと。8711の孤立uvicorn reload子プロセスは、以前の失敗したdev起動由来で、診断開始前から存在した。
    - 検証用のwhub app devをwhub app down --devで停止した。app-dev.pidと8712/8713の待受は消え、診断前からの8711孤立プロセスは変更しなかった。
    deleted: false
  - title: 通常モードと開発モードを完全に分離する
    acceptance: []
    steps:
    - description: 通常モード8710、開発モードのVite 8712・API 8713、モード別PID記録、および開発モード停止のCLI契約を定義する
      state: done
      skip_reason: null
      deleted: false
    - description: 開発モードのポート・PID記録・Vite API proxy・停止操作を通常モードから独立させる
      state: done
      skip_reason: null
      deleted: false
    - description: 両モードの同時起動、各モードのhealth、片方を停止した際の他方の存続、およびプロセス残留なしを自動・実行環境で検証する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 通常モードは8710とapp.pidを維持する。開発モードはVite 8712・API 8713・app-dev.pidを使用し、whub app down
      --devで開発モードだけを停止する。各起動コマンドは同一モードのPID記録だけを参照する。
    - 開発モードをVite 8712・API 8713・app-dev.pidへ変更し、Vite API proxyとwhub app down --devを通常モードから分離した。対象pytest
      17件とnpm buildは成功した。
    - 実行環境で開発モードの8712/8713待受、Vite経由health、app-dev.pid、down --dev後のPID・ポート残留なしを確認した。全pytestは276
      passed、wflow task checkはvalid。
    - '注記: ターミナル終了時にrunnerが終了してapp-dev.pidを削除し、uvicorn reloadの子孫だけが8713に残留する事象を後続確認で検出した。'
    - '対応: 開発runnerのstdinをDEVNULLへ切り離し、SIGHUPを無視するようにした。API/Viteは個別プロセスグループで起動し、down --devはPID記録の各開発プロセスグループも直接終了する。'
    - '再検証: runnerへのSIGHUP後もPID記録・8712/8713・Vite経由healthが維持され、down --dev後にrunner・API reload子孫・Vite・PID記録・8712/8713がすべて消えることを確認した。全pytestは278 passed。'
    deleted: false
approvals:
- actor: user
- actor: user
- actor: user
