  objective: whub agent open のImplementerでは、agent-auth.yamlにuv run pytestおよびuv run
    ruffのprefix grantがある一方、Codex adapterが全prefixをdecision = promptのruleへ変換するため、対象ファイルを指定したテスト・Ruffのたびに承認が求められる。Codex
    ruleのallowはsandbox外での無承認実行を意味するため採用せず、workspace-writeかつnetwork denyのsandbox内で検証コマンドを自動実行できるようにする。
  approach:
  - Codex adapterがverification用grantをprompt ruleとして出力する経路を見直し、通常のsandbox実行を妨げない設定へ変更する。uvがsandbox外のcache・venv・一時領域へ書き込む場合は、実際の拒否理由を検証して必要な領域だけをworktree内へ収める。pytest/Ruffの対象指定実行、sandbox外アクセスの承認維持、既存adapterテストを受け入れ条件とする。
