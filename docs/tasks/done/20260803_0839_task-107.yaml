schema_version: 1
task:
  id: TASK-107
  state: completed
  title: Terminalの複数OperationとGit Explorer改善
  objective: Terminal画面で複数の独立Operation端末を安全に起動・切替・個別終了でき、初期表示はOperationを選択する。差分Explorerは.gitignoreを尊重したコードベース全体を折りたたみ表示し、変更・新規状態をVS
    Codeに近い視覚表現で示す。
  approach:
  - Operationごとに独立したtmux sessionと識別子を保持し、既存の端末ブリッジに接続する。ファイルツリーはgit ls-files --cached
    --others --exclude-standardを基に構築し、差分状態を重ねて表示する。先行タスクのmerge後にworktreeを作成する。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
