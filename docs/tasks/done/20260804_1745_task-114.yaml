        result: Terminal選択時にxtermとWebSocketを再生成し、.xtermを親全面へ固定した。Operation tmuxにはWHUB_OPERATOR_IDとCOLORTERM=truecolorを渡し、NO_COLORを親環境とlogin
          shellの双方で除去した。承認通知ルーターの欠落importも修正した。
      deleted: false
    deleted: false
  - title: 検証
    acceptance: []
    steps:
