  - Phase 1で症状、再現条件、ブラウザ・xterm・PTY・tmux間の寸法遷移を観測し、原因と対策は検証結果に基づいて後続Phaseで決定する。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance: []
  phases:
  - title: 調査
    acceptance: []
    steps:
    - description: Terminal選択切替時の描画・サイズ不整合と、新規OperationのCOLORTERM伝播を再現・観測し、原因・対策・検証条件を事実で確定する。
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        症状: Explorerで選択するworktreeまたはTerminalを変更すると、tmux Terminalが確保領域全体に描画される場合と、左上の小さい領域に縮小して描画される場合がある。
      deleted: false
    - value:
        推測原因: 未確定。未検証の推測は記録しない。
      deleted: false
    - value:
        解決策の案: 未確定。調査で原因と再現条件を確認後に、対策案と検証条件を計画へ追加する。
      deleted: false
    - value:
        finding: TerminalWidgetは選択先変更時も同一xterm instanceを再利用し、WebSocketだけを再接続している。Operation
          tmux作成はWHUB_OPERATOR_IDのみを渡し、COLORTERM=truecolorを渡していない。切替時の表示再生成とtmux環境の両設定を対策候補として検証する。
      deleted: false
    - value:
        manual_observation: COLORTERM=truecolorとWHUB_OPERATOR_IDの伝播はfresh Operationで確認済み。Operationからworktreeへの切替ではxtermが既定80x24のまま残ることがあるため、接続確立直後ではなく次の描画フレーム後に強制fitする対策を追加して再確認する。
      deleted: false
    - value:
        correction: 描画不安定は接続後fitの遅延だけでは解消しなかった。xtermの外側コンテナには高さがある一方、内側.xtermには高さがなく、fit失敗時に既定canvasだけが残る。内側.xtermを親全面に固定し、接続後fitは即時強制resizeへ戻した。tmuxはxterm-256color:RGBを有効化済みである。
      deleted: false
    - value:
        root_cause: 実行中Codexの環境にNO_COLOR=1、TERM=tmux-256color、COLORTERM=truecolorを確認した。NO_COLOR=1がCodex
          TUIを白黒に強制していた。Operation起動時に親環境からNO_COLORを除外し、login shell実行前にもunsetする。既存Operationは停止・再作成して確認する。
      deleted: false
    - value:
        result: Terminal切替でxterm instanceを再生成し、内側.xtermを親全面に固定することで描画領域を安定化した。OperationのNO_COLOR継承を除去し、COLORTERM=truecolor、tmux
          RGB、Codexのカラー表示を手動確認した。
      deleted: false
    deleted: false
  - title: 修正
    acceptance: []
    steps:
    - description: 選択切替後もTerminalを確保領域全体へ安定して描画し、Operation tmux作成時にWHUB_OPERATOR_IDとCOLORTERM=truecolorを共存させる。
      state: done
      skip_reason: null
