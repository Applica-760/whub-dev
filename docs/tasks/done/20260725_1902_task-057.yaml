      deleted: false
    log:
    - value:
        調査: 'home-serverの非対話SSH実測: PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
