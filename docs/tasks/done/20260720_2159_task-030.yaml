      state: done
      skip_reason: null
      deleted: false
    log:
    - whub sessionの5 subcommandを登録し、Project・run IDで操作するCLIを実装。live followとrunning
      cleanup拒否の実機検証はGUI session開始後に行う。
    - whub session logs la-il TASK-030-r002だけでGUI paneのecho iketa!を取得。tmux内部IDの手動転記やmountを使用していない。
    - logs --followはtail -n 20 -Fの新規行を行単位で受信し、表示時のみANSI除去。WHUB_FOLLOW_LIVE_030をlive取得後にobserverをCtrl-Cで切断してもr002はrunning・pane生存を維持した。running
      cleanはstatus 1で拒否、pending・failed・interrupted・completed cleanはrun artifactsだけ削除。CLI回帰テストも追加した。
    deleted: false
  - title: 回帰テストと実機検証
    acceptance: []
    steps:
