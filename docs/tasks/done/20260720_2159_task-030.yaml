    log:
    - CLIをreserve・ls・show・logs --follow・clean、run IDをTASK-NNN-rNNN、cleanをrun単位削除、複数pendingは明示選択、launcher依存をpython3・PyYAML・tmux
      3.4、protocol version 1と確定した。
    deleted: false
  - title: 予約とruntime配置serviceの実装
    acceptance: []
    steps:
    - description: RemoteResourceを解決し、mountを使わずSSH経由でlauncherとpending descriptorを生成するsession
