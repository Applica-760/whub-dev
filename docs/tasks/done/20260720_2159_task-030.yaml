      state: done
      skip_reason: null
      deleted: false
    - description: launcherの必要時生成・protocol更新、run ID衝突、SSH失敗、既存runtime保護をservice・modelテストで検証する
      state: done
      skip_reason: null
      deleted: false
    log:
    - SSH stdin上のremote Pythonでlauncherとdescriptorを原子的配置するserviceを実装。la-ilで0700 directory・0600
      file・.whub gitignoreを確認し、unmount状態でもreserve・ls・show・cleanが成功。TASK-030-r001を保持したままr002の作成・削除とlauncher更新を確認した。
    deleted: false
  - title: Linux GUI launcherとtmux記録の実装
    acceptance: []
    steps:
    - description: 固定launcherが通常のblock YAML descriptorをPyYAMLで読み、pendingが1件なら自動選択し複数ならrun
        ID指定を要求する処理を実装する
      state: done
      skip_reason: null
      deleted: false
    - description: GUI環境を継承した専用tmux sessionを開始し、window・paneの動的IDと表示名、raw transcript、runtime
        metadataを記録する
      state: done
      skip_reason: null
      deleted: false
    - description: pane終了code・signalからcompleted・failed・interruptedを永続化し、hook・権限・異常終了をlauncherテストで検証する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 初回TASK-030-r001は専用socketでstart-server後、session作成を別tmux invocationにしたため空serverが終了し、no
      server runningでfailed。stale socketを検出・削除し、start-server・history-limit設定・new-sessionを単一invocationへ統合。一時remote
      socketでsession作成とhistory-limit=50000を実証し、全324テスト後に修正版launcherを配布してTASK-030-r002を予約した。
    - r002でsession作成後のremain-on-exitへsession targetを渡してNo such windowとなる不具合を検出。window
      target =run:、session option/hook target run のtmux 3.4実測結果へ修正した。続くadhoc検証でtmuxが制御文字separatorをliteral
      \037として返すことを検出し、実tab delimiterへ修正。pane %0の自動登録、0600 transcript、出力取得、exit 7からfailed・dead_status=7へのhook更新、cleanupまで実証した。
    - GUI側の再実行時にr002は既にrunning・pane生存だったためpending限定selectがno matching pending runを返した。running
      descriptorでlive tmuxが存在する場合は同じlauncher commandから既存sessionへ再attachし、live sessionが失われていればinterruptedへ遷移する冪等動作へ修正。SSH非TTYではattachだけが期待どおり失敗し、running
      stateとpaneが維持されることを確認した。
    - 別Agentの独立診断とTTY実測が一致し、heredocでPython sourceをstdinへ渡す構造がGUI terminalのTTYを失わせる根本原因と確定。launcher.shを257-byte
      thin wrapper、launcher.pyを独立package assetへ分離し、helper→wrapper順で原子的配布。attach共通化、非TTY事前拒否、hookからhelper直接実行、global
      remain-on-exit、run単位flock、metadata検証へ整理した。PTY付きSSHからr002へ実attachし、tmux画面表示後にdetach成功。全325テスト成功。
    - Linux GUI terminalからTASK-030-r002へattach成功後、pane %0でecho iketa!を実行。Mac側whub
      session showでrunning・pane生存、whub session logsで入力commandと出力iketa!を取得し、GUI起動sessionの永続transcript経路を確認した。
    - GUI paneのprobe履歴からDISPLAY=:0・WAYLAND_DISPLAY=wayland-0とWHUB_STDERR_PROBEを取得。初回は.venv/bin/python直接実行によりPATHへ.venv/binが入らず、rr.spawnがRerun
      Viewer executable not foundで失敗したが、その完全なtracebackをwhub session logsで取得できた。.venv/bin/rerun
      0.26.2の存在を確認し、probe commandへPATH=:。
    - 修正版probeでDISPLAY=:0・WAYLAND_DISPLAY=wayland-0、WHUB_STDERR_PROBE、Rerun gRPC listen、WHUB_RERUN_READY、wgpu/llvmpipe初期化をtranscriptから取得し、ユーザーがLinux
      GUI上のviewer表示を確認。8秒後のRuntimeError WHUB_INTENTIONAL_TRACEBACKは意図的で、完全なtracebackをwhub
      session logsから取得した。
    - '訂正: probe commandへ追加したliteral設定は PATH="$PWD/.venv/bin:$PATH"。直前logの絶対path表記はwflow記録時にlocal
      shellが展開したもので、remoteで実行した内容ではない。'
    - adhoc-r001でpane shellをexec sleepへ置換しSIGKILL。hookによりstate=interrupted・dead_signal=9・dead_status=nullをdescriptorへ永続化した。別実測のexit
      7はfailed・dead_status=7、TASK-030-r002のexit 0はcompleted・dead_status=0。runtime権限0700/0600と異常終了traceback保存も確認済み。
    deleted: false
  - title: whub session CLIと観測処理の実装
    acceptance: []
    steps:
    - description: whub session reserve・ls・show・logs・cleanを追加し、Projectとrun IDだけでsessionを操作できるようにする
