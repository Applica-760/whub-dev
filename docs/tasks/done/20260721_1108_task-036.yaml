schema_version: 1
task:
  id: TASK-036
  state: completed
  title: remote GUI向けcommand handoff Markdownを追加する
  objective: Mac側whubからLinux GUI側へ複雑なcommandを崩さず渡し、利用者が単一Markdownを開いて最新commandをすぐコピー実行できるようにする
  approach:
  - .whub/handoff/commands.mdをProjectごとの単一handoff fileとし、commandごとのfileは作らない
  - 新規entryをfile先頭へ挿入し、entryとfenced code blockの上下を空行で区切って、最新commandがfileを開いた直後に見えるようにする
  - timestampはZoneInfo("Asia/Tokyo")で生成し、YYYY-MM-DD HH:mm:ss JSTの可読形式でrun ID・目的とともに見出しへ記録する
  - Markdownは人間がcopyして明示実行するhandoffに限定し、自動実行やMarkdownからのcommand解析は行わない
  - mountに依存せずSSH経由で0600 fileへlock付き原子的更新を行い、先頭挿入順・空行・code fence・timezone・既存内容保持を検証する
  depends_on:
  - TASK-030
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: 複雑な複数行commandがremote側commands.mdの最新entryへ内容を崩さず記録される
  - id: ACC-002
    statement: 並行更新でも既存entryを失わず、handoff directoryは0700、fileとlockは0600になる
  - id: ACC-003
    statement: Markdownからcommandを解析・自動実行せず、利用者がcopyして明示実行できる
  - id: ACC-004
    statement: session関連テストとuv run pytest全体が成功する
  phases:
  - title: handoff契約とMarkdown形式を確定する
    acceptance: []
    steps:
    - description: stdin入力、明示Project・run ID・単一行purpose、既存session検証を含むhandoff CLI契約を確定する
      state: done
      skip_reason: null
      deleted: false
    - description: JST timestamp・run ID・purpose・可変長bash code fenceからなる先頭entry形式と改行規則を確定する
      state: done
      skip_reason: null
      deleted: false
    - description: SSH stdin転送、flock、同一directory内の一時fileとos.replace、0700・0600権限の更新契約を確定する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 'CLIは whub session handoff PROJECT RUN_ID --purpose TEXT とし、commandはstdin専用で受け取る。TTY・空白のみ入力、空または改行を含むpurpose、不正または未知runを拒否し、既存runのstateは制限しない。Markdownは
      ## YYYY-MM-DD HH:mm:ss JST | RUN_ID | PURPOSE、空行、可変長bash fence、command、空行の順とし、本文はcode
      fenceに必要な末尾LFがない場合だけ補完する。timestampはMac側でZoneInfo Asia/Tokyoから生成し、payloadをJSONでSSH
      stdinへ送る。remoteでは.whub/handoffを0700、commands.mdと永続lockを0600とし、descriptor確認後にflock内で既存bytesを保持したまま先頭entryを同一directoryのtempfile・fsync・os.replaceで更新する。session
      launcher asset頒布は変更しない。'
    deleted: false
  - title: handoff CLIとremote更新serviceを実装する
    acceptance: []
    steps:
    - description: whub session handoff CLIと入力検証をcommands層へ実装する
      state: done
      skip_reason: null
      deleted: false
    - description: commandをJSON payloadでSSH stdinへ渡し、commands.mdをlock付き原子的に先頭更新するserviceを実装する
      state: done
      skip_reason: null
      deleted: false
    - description: 空入力・不正purpose・未知run・local resource・SSH失敗をservice・CLIテストで検証する
      state: done
      skip_reason: null
      deleted: false
    log:
    - whub session handoff PROJECT RUN_ID --purpose TEXTを追加し、stdinのTTY・空入力と単一行purposeをCLIで検証した。serviceはrun
      ID・purpose・commandを検証し、JST timestampを含むJSON payloadを既存SSH経路へ渡す。remote Pythonはdescriptor存在確認後、.whub/handoffを0700、commands.lockとcommands.mdを0600に設定し、flock内で既存bytesを保持して可変長bash
      fence entryをtempfile・fsync・os.replaceで先頭挿入する。local resource、未知remote run、空入力を含むservice・CLI
      22テスト、CLI help、git diff --checkが成功した。
    deleted: false
  - title: 回帰テストとremote実地検証を行う
    acceptance: []
    steps:
    - description: 複数行・quote・dollar・backslash・heredoc・backtickを保持するMarkdown形式を検証する
      state: done
      skip_reason: null
      deleted: false
    - description: 連続・並行更新で既存entry保持・最新先頭・空行・code fence・権限を検証する
      state: done
      skip_reason: null
      deleted: false
    - description: session関連テスト、全pytest、git diff check、Task整合性検査を成功させる
      state: done
      skip_reason: null
      deleted: false
    - description: unmount状態のremote Projectでhandoff fileの生成と人手copy実行を確認する
      state: done
      skip_reason: null
      deleted: false
    - description: READMEのRemote GUI session節へstdin handoff、Linux GUIでのcopy実行、保持・clean境界を記載する
      state: done
      skip_reason: null
      deleted: false
    log:
    - remote scriptを一時Project上で直接実行し、quote・dollar・backslash・heredoc・日本語・3連backtickを含むcommand、末尾LF補完、最新先頭、既存CRLF
      bytes保持、0700・0600を検証した。8 process同時更新でも全entryを保持した。session対象24テストと全339テスト、git
      diff --checkが成功。la-ilを一時unmountし、TASK-036-r001をreserve後にhandoffをSSH経由で生成した。SSH読取でpending
      descriptor、先頭entry、handoff 0700、commands.md・commands.lock 0600を確認し、la-ilはmount済みへ復帰した。人手copy確認のためrunはpendingのまま保持する。
    - ユーザーがLinux GUI側でcommands.md先頭の検証commandをcopy実行し、WHUB_HANDOFF_036_OKを確認した。READMEのcommand一覧とRemote
      GUI session節へ、stdin専用handoff、quoted heredoc、既存run・単一行purpose、mount非依存、Linux
      GUIでのcopy明示実行、自動解析・実行をしない境界、Project単一fileの履歴保持、session clean非削除を記載した。検証run TASK-036-r001はpendingを確認してcleanし、run一覧が空でcommands.mdが保持されることをSSH経由で確認した。
    deleted: false
