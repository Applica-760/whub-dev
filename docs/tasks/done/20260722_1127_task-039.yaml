schema_version: 1
task:
  id: TASK-039
  state: completed
  title: WhubContextへ管理ファイルアクセスを集約する
  objective: config・Manifest・Todo・downloadsへのアクセスをWhubContextインターフェースへ集約し、consumerを変更せずlegacy
    data_dir backendから.whub直下backendへ安全に切り替えられる構造にする
  approach:
  - Phase 1で既存の.whub/config.toml・data_dir・環境変数による解決挙動をinterface内部へ隔離してconsumerを移行し、Phase
    2で同じinterfaceを.whub直下へhard switchしてdata_dirを廃止する。実運用データの移動とrelease cutoverは親TASK-037に残す。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: TASK-037
plan:
  acceptance:
  - id: ACC-006
    statement: manifest.yaml・todos.yaml・downloadsはoperation rootの.whubへ複製し、Stable更新まではvault/whubの元データを保持して旧Stableと開発版を並行利用できる。FOCUS.mdは移行対象外とする。
  phases:
  - title: 互換interfaceを導入しlegacy backendへconsumerを集約する
    acceptance:
    - id: ACC-001
      statement: config・Manifest・Todo・downloadsのconsumerがWhubContextだけに依存し、data_dirおよび配置規則を認識しない。
    - id: ACC-002
      statement: legacy backend利用時のconfig.toml・data_dir・WHUB_ROOT・WHUB_DATA_DIR解決が変更前と一致し、characterization
        testに成功する。
    steps:
    - description: 現行の.whub/config.toml、data_dir、WHUB_ROOT、WHUB_DATA_DIRによるconfig・Manifest・Todo・downloads解決と全consumerをCodeGraphおよびcharacterization
        testで固定する。
      state: done
      skip_reason: null
      deleted: false
    - description: physical cwdと同一実体であることを検証したlogical PWDからcontext rootを確定し、config・Manifest・Todo・downloadsを論理resourceとして扱うWhubContext
        interfaceを実装する。
      state: done
      skip_reason: null
      deleted: false
    - description: 現行のconfig.tomlとdata_dir・環境変数によるpath解決および基本read/writeをlegacy backendとしてinterface内部へ隔離し、consumerへdata_dirを公開しない。
      state: done
      skip_reason: null
      deleted: false
    - description: Manifest・Todo・Fetchと関連Model/ServiceをWhubContext経由へ移行し、各consumerによる.whub配下pathまたはdata_dirの直接組み立てを除去する。
      state: done
      skip_reason: null
      deleted: false
    - description: focused test、既存挙動との比較test、全pytest、pre-commitを実行し、挙動不変とinterface境界を検証してPhase成果をcommitする。
      state: done
      skip_reason: null
      deleted: false
    log:
    - 'Phase 1完了: core/context.pyへWhubContextを実装し、検証済みlogical PWD・WHUB_ROOT・package
      fallbackによるroot選択と、WHUB_DATA_DIR・config.toml[data_dir]によるlegacy backendをinterface内部へ隔離した。Manifest・Todo・downloads・App・Init・Link・VS
      Code・PathErrorの全consumerをWhubContextへ直接移行し、core/paths.pyと旧testを削除。CodeGraph同期後current_contextは23
      callers、core.pathsは0件。focused 74 tests、全347 tests、変更file ruff、pre-commit Ruff/Prettier、Knowledge
      check成功。operation rootで旧Stable版と開発版のroot・manifest・todo・downloads path一致と実Manifest読取を確認した。開発editable
      .pthのhidden flag再発時は解除後にphysical/logical project指定を比較し、両方がdevelopment sourceをimportしflagが再発しないことを確認した。'
    deleted: false
  - title: 同じinterfaceを.whub直下backendへ切り替える
    acceptance:
    - id: ACC-003
      statement: 同じWhubContext interfaceがconfig・Manifest・Todo・downloadsをcontextの.whub直下へ直接解決し、legacy
        backendへのfallbackまたはdual-readが残っていない。
    - id: ACC-004
      statement: whub initがcwdに新規contextを作成でき、外部data_dirを要求または記録しない。
    - id: ACC-005
      statement: operation root、logical symlink、physical checkout、context欠落を含むpath
        testと全回帰検証が成功する。
    steps:
    - description: vault/whubのmanifest.yaml・todos.yaml・downloadsをoperation rootの.whubへ複製し、内容一致を検証する。Stable互換のため元データは削除せず、FOCUS.mdは対象外とする。
      state: done
      skip_reason: null
      deleted: false
    - description: WhubContextをconfig.toml・manifest.yaml・todos.yaml・downloadsがcontextの.whub直下へ直接解決されるbackendへ切り替え、consumerを変更せず動作させる。
      state: done
      skip_reason: null
      deleted: false
    - description: whub initをcwdの.whub context初期化へ変更し、data_dir・WHUB_DATA_DIR・WHUB_ROOT・package位置fallbackとlegacy専用path
        APIを削除する。
      state: done
      skip_reason: null
      deleted: false
    - description: operation rootと検証済みlogical PWDが同じ.whubを選び、physical development
        checkout直接起動とcontext欠落が明示エラーになるtestを追加する。
      state: done
      skip_reason: null
      deleted: false
    - description: focused test・全pytest・pre-commitを実行し、旧Stableがvault/whubを、operation
        rootからの開発版が.whubを読むsmoke testとKnowledge整合性を検証してPhase成果をcommitする。
      state: done
      skip_reason: null
      deleted: false
    log:
    - vault/whubのmanifest.yaml・todos.yaml・downloads配下3 logをoperation rootの.whubへ上書きなしで複製した。5ファイルすべてSHA-256がコピー元と一致。vault/whubの元データとFOCUS.mdは変更していない。
    - WhubContextのmanifest_path・todo_path・downloads_dirをcontext/.whub直下へhard switchし、config
      contentをpath解決に使用しないdirect backendへ変更した。consumer変更なし。
    - whub initを引数なしでcwdの.whub/config.tomlを作るcontext初期化へ変更。WHUB_ROOT・WHUB_DATA_DIR・package
      fallback・legacy data_dir backendをproduction codeから削除し、rgで0件を確認した。
    - operation root・検証済みlogical PWDはoperation .whubを選択し、physical development checkout単独はPathErrorになるtestとsmokeを確認。OpenAPI
      exportから不要なcontext/frontend dist依存も除去した。
    - CodeGraphを再同期し18 changed files・212 nodesを反映。current_contextは19 production callers。旧symbol名探索はsubstring結果を含むため、production
      rgでWHUB_ROOT・WHUB_DATA_DIR・_package_workspace_root・_legacy_data_dir・data_dirが0件であることを確定した。
    - '補足: legacy symbol 0件はdevelopment repository を対象とした結果。operation
      repositoryの旧sourceには、固定中の擬似Stableがvault/whubを読み続けるためlegacy実装を意図的に残しており、TASK-037
      cutover後に除去する。'
    - focused 61 tests、OpenAPI focused 2 tests、全343 tests、pre-commit Ruff/Prettier、Knowledge
      check、git diff --checkが成功。旧Stableはvault/whubから14 projects、開発版はoperation .whubから同じ14
      projectsを読み、manifest/todo hash一致。logical PWD成功、physical checkoutはPathError。CodeGraph同期済み。
    deleted: false
approvals:
