schema_version: 1
task:
  id: TASK-111
  state: completed
  title: Codex CLI承認待ちをWeb通知へ連携する
  objective: tmux上のnative Codex CLIで生じるPermissionRequestを、利用者が一度だけ信頼するuser-level Hookからwhub
    Web appへ届ける。該当する登録済みAgent worktreeを既存のattention UIで強調し、非表示タブではBrowser Notificationを出して実ターミナルへ導く。
  approach:
  - 既存のapproval_attention store、/api/agent-attentionの取得・既読化、Terminal選択行のバッジ・固定banner・Browser
    Notificationを再利用する。UIの新設やApp Server会話UIの拡張は行わない。
  - Task 104でworktree-local PermissionRequest/PostToolUse Hookを試したが、project trustとHook
    trustが別であり、生成されるworktreeごとに再承認が必要だった。加えてCode Mode executorの承認はCodex lifecycle
    Hookを通らない。この失敗を再導入しない。
  - Hookは~/.codex/hooks.jsonの固定user-level sourceに置き、利用者が内容を確認して一度だけ/hookで信頼する。Agent
    openはglobal設定を自動編集せず、通知対象の登録・解除だけを担う。Hookは任意のcwdで発火するため、backendが登録済みAgent worktreeと厳密一致するcwdだけを受理する。
  - 固定HookスクリプトはPermissionRequestのstdin JSONからsession_id、cwd、turn_id、tool_name、tool_inputを読み、localhost限定APIへ送る。送信失敗・Web
    app停止時も正常終了して通常のCodex承認フローを妨げない。native Codex CLIだけを対象とする。
  - App ServerはTask 104で承認イベントの唯一の入力として導入されたが、本Taskでは変更しない。理由はtmuxのCLI対話を置換せず、通知だけを横断的control
    planeへ追加するためである。
  - MulmoTerminalの調査では、実CLIをPTY/xtermへそのまま中継し、Claudeはspawn時Hookで状態をserverへ送る。Codexのworktree-local
    Hook信頼を解決する実装は確認できず、session同定・再開にはrollout JSONLを利用している。本Taskは画面出力の正規表現解析を正本にせず、公式PermissionRequest
    Hookを採用する。
  - 解除の完全なイベント契約は未決定である。PostToolUseで解除できるケース、拒否・放置時のTTL失効、同一Taskで複数要求が重なる場合を実装前に検証して決定する。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
