    steps:
    - description: 親ProjectをWorktreeDefinitionのparent_projectからmanifestへ解決し、localかつ有効なgit宣言を持つResourceだけを操作対象にする。remote
        Resourceは未実装であることを明示して拒否する
      state: done
      skip_reason: null
      deleted: false
    - description: 定義YAMLを先に保存してからgit worktree addを実行し、Git失敗時は定義を変更せず操作失敗として返す。親の現在pathはmanifestから解決し、子worktreeをmanifest
        Projectやsymlinkとして追加しない
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        verification: 親Projectの動的解決、remote未実装拒否、定義先行保存とGit worktree作成を実装し、uv run pytest
          src/whub/tests/services/test_worktree.pyで15件、ruff checkで成功。
      deleted: false
    deleted: false
  - title: 一覧と削除の安全条件を実装する
    acceptance: []
    steps:
    - description: 登録済み定義を一覧化し、directory欠損・Git worktree不整合を診断として表示できるservice結果を返す
      state: done
      skip_reason: null
      deleted: false
    - description: 削除前にtracked・untracked変更、Git worktree実体と定義の不整合を検査し、問題があれば拒否する。Git
        worktreeと定義YAMLだけを削除し、branchは保持する
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        note: YAML名不一致でもdirectoryが存在する場合にGit照合を継続して複数diagnosticを返す改善は、削除安全条件に影響しないため後続の小改善として扱う。
      deleted: false
    - value:
        verification: 登録定義とGit worktreeの照合、clean状態確認、Git worktree削除後の定義YAML削除を実装した。tracked・untracked変更、不整合、Git/YAML削除失敗を拒否し、uv
          run pytestの31件とruff checkで成功。
      deleted: false
    deleted: false
