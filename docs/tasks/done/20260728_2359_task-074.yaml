    acceptance: []
    steps:
    - description: parent_projectとtask_idの組をworktree識別子として扱い、create時に対象ProjectのTask
        YAMLが存在することを確認する。同じ組への既存定義がある場合は上書きせず拒否する
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        verification: create時に対象ProjectのTask YAMLをload_project_taskで検証し、worktree識別子と重複判定をparent_projectとtask_idの組へ修正した。uv
