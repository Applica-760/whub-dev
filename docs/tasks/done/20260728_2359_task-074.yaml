          diff --checkで成功。
      deleted: false
    deleted: false
  - title: 契約を検証し文書化する
    acceptance: []
    steps:
    - description: 登録、作成、一覧、削除、remote拒否、Git失敗、不整合、未コミット変更をservice・CLI境界で自動テストする
      state: done
      skip_reason: null
