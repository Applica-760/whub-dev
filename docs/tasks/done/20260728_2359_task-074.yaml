  state: completed
  title: worktree CLI操作を実装する
  objective: 登録済みworktreeを対象に、Git worktreeの作成・一覧・削除と対応するproject symlinkの作成を安全に実行する
  approach:
  - TASK-072の登録・整合性サービスだけを参照し、CLI adapterには表示と引数解釈を置く
  - 未コミット変更、稼働session、Git worktree不整合時は削除を拒否する
  depends_on:
  - TASK-072
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
