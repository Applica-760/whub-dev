    - description: worktreeとCLI referenceを実装済みの操作契約へ更新し、稼働sessionの検出・削除拒否はTask、worktree、sessionの対応を保存・検証する後続Taskの責務として記録する
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
