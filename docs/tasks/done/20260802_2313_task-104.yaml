    App Serverの権限通知購読へ置換し、実装と最終結合検証を別sessionへ分離する
- reason: Codex App Serverが承認要求を所有するため、具体イベント、session lifecycle、最小クライアント、Worktree実装とrepo
    session最終検証を明記する
- reason: 論理削除済みの旧Phaseは完了扱いとなるため、App Server実装・Worktree引継ぎ・repo最終検証を新規Phaseへ記録する
- reason: 実機検証で agent open CLI と app dev API が別プロセスのためApp Server registryを共有できないことを確認。Web
    backendをApp Server所有者に変更する。
