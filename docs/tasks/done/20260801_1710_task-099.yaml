    - description: 選択したworktreeのproject/task_idで既存Terminal WebSocketへ接続するxterm.js端末を実装し、接続・リサイズ・切断時の破棄を扱う
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        finding: 実行中release 0.1.0+g88e673c9ではAPIWebSocketRouteは登録済みだが、依存定義がuvicorn本体のみでwebsockets/wsprotoが未導入。Uvicornのws_protocol_classはNoneで、実WebSocket
          UpgradeはHTTP 404となるため接続不能。フロントURL・route不一致やworktree diagnosticではなく、WebSocket
          protocol実装の欠落が根本原因。WebSocket handshakeの統合テストも未実装。
      deleted: false
    - value:
        result: UvicornのWebSocket protocol実装としてwebsockets>=13.0をruntime依存へ追加し、uv.lockを更新した。実Uvicorn
          listenerと本番同一pathを使うWebSocket Upgrade回帰テストを追加し、対象テスト6件が成功した。
      deleted: false
    deleted: false
