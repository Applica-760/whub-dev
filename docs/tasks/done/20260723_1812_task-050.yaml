schema_version: 1
task:
  id: TASK-050
  state: completed
  title: Project Knowledgeを規範管理として再設計する
  objective: Project固有の規範を人間とAgentが低負担かつ正確に参照できるよう、Knowledgeの責務・schema・段階的取得・evidenceとの分担を再設計する
  approach:
  - FOCUSは現役運用から除外し、Vaultの入力・整理・昇格運用は別Taskで扱う
  - Knowledge YAMLの維持・縮小または自動生成・廃止を、検索負担・発見性・鮮度・重複・検証可能性・移行コストで比較する
  - 既存Knowledgeを前提にせず、実装・参照箇所・利用場面と代表的な情報取得課題から必要なナレッジ機構を導く
  - 採用方式の決定後に、KnowledgeのSSOT・schema・Agent取得経路を一貫させ、必要な実装変更と検証を行う
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: FOCUSの定義・運用規約・制約・現役ファイルが除外され、現在の運用経路から参照されない
  - id: ACC-002
    statement: Knowledge YAMLの維持・縮小または生成・廃止が、現行実装と代表的な情報取得場面に基づいて比較され、採用理由が記録される
  - id: ACC-003
    statement: 実証されていないmandatory queryを残さず、有用な確定知識を失わない保存先または移行方法が定義される
  - id: ACC-004
    statement: 採用方式がKnowledge機能・データ・Project AGENTS・Agent取得経路へ一貫して反映され、代表場面と回帰テストで検証される
  phases:
  - title: 現状と評価課題を確定する
    acceptance: []
    steps:
    - description: FOCUS除外の実行結果とTASK-022の陳腐化理由を記録し、旧前提を現行設計へ持ち込まない
      state: done
      skip_reason: null
      deleted: false
    - description: Knowledgeのモデル・CLI・Web・AGENTS・Skill・テスト・実データと、必須queryが入る全経路を調査する
      state: done
      skip_reason: null
      deleted: false
    - description: ナレッジ取得が必要な代表場面を定義し、検索負担・発見性・鮮度・重複・検証可能性・移行コストの評価基準を確定する
      state: done
      skip_reason: null
      deleted: false
    log:
    - FOCUSを現役Knowledgeから除外し、def:focus、関連Policy 3件、Constraint 1件をwhub knowledge rmで削除してcheck成功。vault/whub/FOCUS.mdを削除し、AGENTSとBacklogの現役参照を除去。TASK-022はpure
      Hub分離・固定context化後の陳腐化したapproachを更新できないためcancelし、本Taskへ置換した。過去Task・spec・literatureの歴史的言及は変更していない。
    - 'Knowledge subsystemをCodeGraphと実装で調査。docs/knowledge.yamlは342行、DEF 42・REL 12・POL
      19・CON 53の計126エントリで、実装やADRへのrefは18件、RELのrefは0件。local ProjectでKnowledge YAMLが存在するのはwhub-devだけ。queryはcase-insensitive
      substring一致と直接Relation/Exception展開で、意味検索・ranking・自動context選択はない（例: taskで80行）。固有価値はschema/重複key/参照整合性/ref
      path検証、atomic write、参照中entryの安全な削除。consumerはCLIと読み取りWeb UIで、製品runtimeやtestがKnowledge内容から挙動を導く構造はない。mandatory
      queryはwhub-dev AGENTSの2条件とrefile Skillの2箇所にあり、同内容はREADME・ADR・実装・testにも重複する。FOCUSの陳腐化は手動複製の鮮度問題を実証した。'
    - 代表場面を、実装変更前の不変条件確認、用語・責務・設計理由の確認、運用フロー判断、未知コード領域の調査、過去意思決定の確認に確定。評価基準を、正確性、情報到達までの手間、鮮度、更新重複、検証可能性、発見性、移行時の情報損失に確定し、ユーザー合意を得た。
    deleted: false
  - title: 移行対象と文書責務を確定する
    acceptance: []
    steps:
    - description: Knowledge YAMLの有効な事実・規約を棚卸しし、README・reference・architecture・ADR・operations・developmentへの移行先を確定する
      state: done
      skip_reason: null
      deleted: false
    - description: README、docs/reference、docs/architecture、docs/developmentを作成または更新し、既存ADR・operationsとの責務境界を明記する
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        inventory: docs/knowledge.yamlの126件を確認。CLI・manifest・基本概念はREADME/reference、設計制約はarchitecture/development、release・GUI
          sessionはoperations、Task運用はREADMEへ配置する。Knowledge自身とそのCLI規約は移行しない。
      deleted: false
    - value:
        mapping: 移行先をREADME、docs/reference、docs/architecture、docs/development、既存docs/ADR・docs/operationsへ確定。
      deleted: false
    - value:
        documents: docs/reference/cli.md、docs/reference/manifest.md、docs/architecture/overview.md、docs/development/conventions.mdを追加し、READMEとAGENTS.mdを新しい参照先へ更新した。
      deleted: false
    deleted: false
  - title: Knowledge機能を完全廃止する
    acceptance: []
    steps:
    - description: Knowledge YAML、CLI、モデル、サービス、Web API/UI、関連テストと現役参照を削除し、互換レイヤーを残さない
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        removal: Knowledge YAML、CLI、モデル、service、Web API/UI、frontend型・テスト、現役参照を削除。ADR-0013で廃止と文書構成を記録した。
      deleted: false
    deleted: false
  - title: 移行結果を検証する
    acceptance: []
    steps:
    - description: CLI運用規約と実装制約の代表場面で新しい文書構成への到達性を確認し、ドキュメントリンクを検証する
      state: done
      skip_reason: null
      deleted: false
    - description: 変更範囲のfocused test、全体回帰、静的な参照検索を実行し、独立した成果をcommitする
      state: done
      skip_reason: null
      deleted: false
    log:
    - value:
        reachability: python -m whub --helpにknowledge commandがなく、FastAPIに/api/knowledge
          routeがないこと、新規4文書の存在を確認した。
      deleted: false
    - value:
        verification: CLI・Web API focused test 101件、Python全体回帰411件、frontend typecheck、frontend
          test 23件、静的参照検索、git diff --checkが成功。commit 25af0fa。release 0.1.0+g25af0fa4をbuild・verify・applyし、~/.local/bin/whubでKnowledge
          command不在を確認。
      deleted: false
    deleted: false
  - title: Knowledgeの必要性を判断する
    acceptance: []
    steps:
    - description: Knowledge YAMLを維持する案、縮小または既存資料から生成する案、廃止する案を現行実装と代表場面で比較する
      state: pending
      skip_reason: null
      deleted: false
    - description: ファイル検索・CodeGraph・構造化docs・Skillによる必要時読込など、mandatory queryを減らす代替方式を比較する
      state: pending
      skip_reason: null
      deleted: false
    - description: 有用情報を失わない移行方法と変更影響を示し、採用方式をユーザー判断で確定する
      state: pending
      skip_reason: null
      deleted: false
    log:
    - 'ユーザー回答: Knowledgeは人間とAgentの双方が参照し、自由記述Markdownより定式化できる点を期待して導入。目的は制約見落とし、運用不一致文書、実装・運用乖離の軽減。DefinitionとPolicy等を分ける分類思想には価値を認める。Agentにはterm
      queryの連打ではなく、必要情報の自動取得と明示制約への即時追従を求める。実装から導ける情報でも深読みによってしか分からない場合は文書化価値がある。Project情報は各Projectに保持し、Vaultへの統合はしない。Remote
      Resourceを含め保存場所を跨ぐ乖離を避け、共有するなら仕組みだけとする。中央台帳と発生源配置に関する質問は再具体化が必要。'
    - '追加回答: Knowledgeは規約変更時に更新する法律文書として維持したい。Agentは変更対象pathに関連する制約を自動取得する。Relationの価値は薄く、Exceptionには価値を感じる。テスト可能な制約はテストを正本とし、部分適用・想定ケースはコードまたはテストのコメント挿入を徹底したい。Web閲覧よりAgent取得を優先。Remote
      Projectは未mount時に開発不能なのでKnowledgeも取得不能でよく、local cacheは不要。基準ケースはCLI運用規約の自動提示とする。'
    - '追加回答: Knowledgeを規範の正本、testを実装保証のevidenceとし、不一致時は自動的に片方へ合わせず判断する分担に合意。applies_to・symbol・ADR・test等の関連情報は動作安定に寄与するなら採用可。取得頻度は対象により異なり、毎回取得によるcontext圧迫を避けるため現時点で固定せず実走後に検討する。コメント形式はsrc/whub/tests/models/test_manifest.pyの冒頭ケース列挙と、対応実装内の単行コメントを基準にする。'
    - 'schema方向の追加合意: 規約は原子的に分ける案に同意しつつ、context圧迫を避ける段階的参照も候補とする。Project相対pathとの対応付けは有用で、applies_toを任意fieldとして採用。短いrationaleをKnowledge内に持ち、長い経緯はADRへ逃がす。汎用Relationは廃止し、applies_to・evidence・exception_to・adr等の用途別参照へ置換する。'
    - '現在の確定方針を統合: KnowledgeはProject-localな規範の正本（法律文書）として維持し、testは実装保証のevidenceとする。規約は原子的に保持し、対象pathが決まった時点で概要、必要な規約本文・例外、evidence・ADRの順に段階的参照できる設計とする。applies_toは任意fieldとし、Project相対glob（例:
      src/whub/commands/**）を許容する。同一対象に該当する複数規約は加算適用し、打ち消し・逸脱はexception_toでのみ明示する。各規約にmust・should・mayの強度fieldを持たせる。汎用Relationは用途別参照へ置換し、短いrationaleはKnowledge、長い経緯はADR、検証ケースはtest冒頭列挙、非自明な適用理由は実装内の単行commentに置く。'
    deleted: true
  - title: 入力・整理・昇格フローを再設計する
    acceptance: []
    steps:
    - description: 外部URL・Daily・Inbox・vault知識・Project Backlog・Todo・Task・確定済みProject知識の入口と出口を定義する
      state: pending
      skip_reason: null
      deleted: false
    - description: Backlogを放置される保管庫にしないため、精査契機・残留条件・昇格・棄却を含む排出契約を定義する
      state: pending
      skip_reason: null
      deleted: false
    - description: 採用方式に合わせてSSOTとdiscourse・refile・task-planning・Project AGENTSの責務を重複なく割り当て、TASK-032との境界を明示する
      state: pending
      skip_reason: null
      deleted: false
    log: []
    deleted: true
  - title: 採用方式を反映して検証する
    acceptance: []
    steps:
    - description: 採用方式に基づき、Knowledge機能・データ・Project AGENTS・Agent取得経路を一ファイルずつ更新する
      state: pending
      skip_reason: null
      deleted: false
    - description: 既存の有用な確定知識を移行または保持し、古いFOCUS参照と汎用Relationを現役Knowledgeに残さない
      state: pending
      skip_reason: null
      deleted: false
    - description: CLI運用規約と実装制約確認の代表場面を実走し、不要なqueryなしで対象pathに適用される規範へ到達できることを確認する
      state: pending
      skip_reason: null
      deleted: false
    - description: 変更範囲に応じたfocused test、全体回帰、参照整合性を検証し、独立したPhase成果をcommitする
      state: pending
      skip_reason: null
      deleted: false
    log: []
    deleted: true
