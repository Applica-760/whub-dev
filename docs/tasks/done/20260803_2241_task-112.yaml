schema_version: 1
task:
  id: TASK-112
  state: completed
  title: Operation・worktreeのCodex通知を統合する
  objective: Operation Terminalと登録済みworktreeのCodexセッションで、PermissionRequestに加えCodexの応答終了を示すStop
    Hookも、既存のExplorerバッジ・タブ通知・既読化を通じてWeb UIへ通知できるようにする。
  approach:
  - Operation tmux起動時に、稼働中のOperationを一意に示すoperator_idを環境変数として束縛する。
  - Codex共通HookはTask worktreeでは既存のcwd照合を維持し、Operationでは明示的なoperator_idをcontrol planeへ送る。全Operationがworkspace
    rootを共有するため、cwdからOperationを推測しない。
  - PermissionRequestとStopを種別付きの独立した通知イベントとして保持する。StopはCodexの応答終了と同時に通知を生成し、PostToolUseは対応する権限リクエストだけを解除して応答終了通知を消さない。
  - Terminal ExplorerのOperation行とworktree行に、既存のバッジ・ブラウザタブ通知・行選択時の既読化を適用する。通知表示はイベント種別を区別し、OSネイティブ通知は対象外とする。
  - 通知ルーティングは認可境界ではない。環境変数だけを信頼せず、backend側でOperationまたはworktreeの登録・稼働状態を検証する。
  - workspace-hub共通のagent auth・rule配布は本Taskの非対象とし、Operation・worktreeのHookからUIまでの通知経路に限定する。
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
