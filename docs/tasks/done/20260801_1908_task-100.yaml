change_requests:
- reason: 静的解析により、入力非表示と再接続後の応答停止がPTY読み取りTaskのcancelでは停止しないos.readに由来する同一ライフサイクル問題である可能性が高く、raw入力とJSON制御の曖昧さも同じ接続境界で解消する計画へ統合するため
cancellation: null
result:
  summary: Terminal bridgeのcancel不能なPTY読取を長寿命pumpへ置換し、構造化入力frame・即時lease解放・非ブロッキングcleanupを実装。backend
    533件、frontend 28件、typecheck、production build通過。dev実機WebSocket確認はリリース後へ持ち越し。
