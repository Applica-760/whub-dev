result:
  summary: remote resourceのmanifestフィールドを再設計し、pathをhost.mount_root相対へ一本化して絶対path前置の重複を解消した。消費11箇所はRemoteResource.remote_pathでの合成に切り替え、mount_root包含validationとcore/health.aggregated_link_sourceは相対化により不要となり削除。併せてmount可否をsshfsの単位に合わせてHost.auto_mountへ移し、resource側mount
    flagを廃止してvscode除外を全remote resource一律へ変更した。release 0.1.0+gf6c537eaをbuild・verify・applyし、実manifestを新スキーマへ移行。実測でsshfs
    1本・mount table 1件の集約を維持したまま、run・fetch・statusが従来と同一のremote絶対pathで動作することを確認した。
