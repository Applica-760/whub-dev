schema_version: 1
task:
  id: TASK-019
  state: completed
  title: Task計画を手編集なしで管理するCLIを整備する
  objective: 名前付きPhase、Task依存、受け入れ条件を含むTask計画を、Task YAMLを直接編集せずCLIで作成・変更できるようにする
  approach:
  - Task YAMLモデルとtask-planningの運用規則を正とし、CLIに不足する作成・変更操作だけを追加する
  - Taskの状態・依存・整合性の検証責務は既存のTask serviceへ保ち、CLIは操作の入口に留める
  - 既存Task YAMLとの互換性を保ち、CLI経由の実Task操作とテストで検証する
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance: []
  phases:
  - title: 計画CLIの操作契約を確定する
    acceptance: []
    steps:
    - description: 名前付きPhase、Step、depends_on、受け入れ条件に必要な作成・変更・削除操作と引数を定義する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 既存のCLI形式に合わせ、plan配下へPhase/Step操作、専用depends・acceptance配下へ追加・削除を置き、serviceでdraft制約と整合性検証を担保する契約を確定した。
    deleted: false
  - title: 名前付きPhaseとStepの計画操作を実装する
    acceptance: []
    steps:
    - description: 名前を指定してPhaseを追加し、対象PhaseへStepを追加・変更・削除できるCLIとserviceを実装する
      state: done
      skip_reason: null
      deleted: false
    log:
    - plan insertを単一serviceへ統合し、--phase-titleによる名前付きPhase作成、--phaseによる対象PhaseへのStep追加、plan
      updateによるPhase/Step名称変更を実装した。service・CLIテスト18件が成功した。
    deleted: false
  - title: Task依存と受け入れ条件の操作を実装する
    acceptance: []
    steps:
    - description: depends_onとTask・Phaseの受け入れ条件をCLIで追加・削除し、既存の整合性検証へ接続する
      state: done
      skip_reason: null
      deleted: false
    log:
    - task depends add/deleteとtask acceptance add/deleteを実装した。依存の重複・自己依存を拒否し、Taskまたは指定PhaseへACC連番を採番する。service・CLIテスト19件が成功した。
    deleted: false
  - title: Task操作serviceの責務とAPIを再編する
    acceptance: []
    steps:
    - description: dependencyとinterruptionをTask間関係の操作として同じmoduleへ配置し、各機能の責務分離を維持する
      state: done
      skip_reason: null
      deleted: false
    - description: operation内部へPhase・Step参照の解析と位置解決を担うhelperを導入し、重複する条件分岐を削減する
      state: done
      skip_reason: null
      deleted: false
    - description: update_stepをStep完了とskipの役割別APIへ分け、CLIとtestを移行する
      state: done
      skip_reason: null
      deleted: false
    log:
    - Task間関係操作をrelation.pyへ集約して依存編集と割り込み操作を別関数のまま維持した。operation.pyへPhase・Step参照helperを導入してif/elifを81件から65件へ削減し、update_stepをcomplete_step・skip_stepへ分離した。関連38件と全281件のtest、Knowledge・Task検証が成功した。
    deleted: false
  - title: CLI完結の計画運用を検証する
    acceptance: []
    steps:
    - description: 新規Taskから計画、依存、受け入れ条件をCLIだけで記録し、checkと関連テストで検証する
      state: done
      skip_reason: null
      deleted: false
    log:
    - レビュー指摘により、approve_planで依存先の存在・完了を確認し、計画変更後もdone/skipped Stepの記述変更を拒否する回帰テストを追加した。関連テスト38件が成功した。
    - task initから前提Taskの計画・承認・完了・archive、対象Taskの名前付きPhase・Step、depends_on、Task/Phase受け入れ条件、check、approve_planまでをCLIだけで実行する統合testを追加した。追加test
      1件と全282件のtestが成功した。
    deleted: false
  - title: 完了済みTaskの関係ビュー表示を是正する
    acceptance: []
    steps:
    - description: 完了済みの依存・割り込み関係をアクティブなTask間ビューから除外する表示規則を定義する
      state: done
      skip_reason: null
      deleted: false
    - description: TASK-010とTASK-013の完了済み割り込み関係を回帰例として、表示条件とグラフのテストを実装する
      state: done
      skip_reason: null
      deleted: false
    - description: Task固有MermaidビューでPhaseの完了状態をStepから導出し、完了・未完了・削除済みPhaseを色分けして回帰testを追加する
      state: done
      skip_reason: null
      deleted: false
    log:
    - Task間関係グラフからcompleted Taskと接続edgeを除外し、TASK-010/013を回帰例として固定。Task固有Mermaidへcompleted/incomplete/deletedのPhase
      classを追加。Python 282件、Web 9件、Web build、knowledge/task検証が成功。
    deleted: false
approvals:
- actor: user
- actor: user
- actor: user
acceptance_results: []
change_requests:
- reason: Task間関係操作の配置、計画参照解決の共通化、Step完了APIの責務分離を計画へ追加する
- reason: Phase 6へTask固有MermaidのPhase完了状態による色分けを追加する
cancellation: null
result:
  summary: Task操作serviceの責務再編、CLI完結検証、Task間関係グラフ規則の是正、Task固有MermaidのPhase状態色分けを実装し、全体回帰テストで検証した。
