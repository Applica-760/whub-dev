result:
  summary: remote projectのTask読み取りをmount走査からremote host上でのtar生成＋ssh 1往復取得へ切り替え、稼働中appで/api/tasks/all
    1.79s -> 0.77s、la-il 1.585s -> 0.26sへ短縮。mountは1 fileあたり約194msかかりfile数に線形だが、ssh側はhandshake
    0.19s + 実作業0.05sのほぼ定数で、Task YAML 1件前後が損益分岐。副次的にremote到達不可時のhost単位接続失敗の使い回しで15.21s
    -> 5.18s、ssh接続失敗の終了コードをcore/remote.pyへ集約。release 0.1.0+g44876c7bとして適用済み
