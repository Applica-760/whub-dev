  state: completed
  title: remote Task読み取りのmount走査からremote実行への切り替え
  objective: remote projectのTask読み取りをmount越しのfile走査からremote host上での一括取得へ切り替え、file数に比例する遅延を取り除く
  approach:
  - docs/tasks配下をtarで1往復取得し、ローカル展開したrootへ既存の解析処理をそのまま適用する
  - local・remoteの分岐はservices/task.pyのtask root解決へ閉じ、CLIとwflow解析層は変更しない
  - ssh失敗時はmountへfallbackせず、Project単位のエラー隔離で扱う
