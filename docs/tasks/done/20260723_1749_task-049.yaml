schema_version: 1
task:
  id: TASK-049
  state: completed
  title: mount・wflow診断表示と復旧ログの強化
  objective: mount内容の読取不能を正常・Task不存在と誤認せず、原因と復旧手順を即座に判断できるエラー表示・health判定・診断ログを提供する
  approach:
  - TASK-048で確定した原因と正常条件を契約にし、mount後の実可読性検証、wflowのエラー分類、復旧に必要な診断情報と回帰テストを追加する
  depends_on:
  - TASK-048
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: mount rootをstatできても子要素を読めない状態をwhub statusとwhub mountが非正常として検出する
  - id: ACC-002
    statement: wflowがProjectまたはdocs/tasksの読取不能と、読取可能なTask不存在を異なるエラーで返す
  - id: ACC-003
    statement: 診断ログにversion・project・mountpoint・失敗段階・安全なoption情報・結果・復旧候補が残り、秘密情報を含まず保存量が制限される
  - id: ACC-004
    statement: 正常時のCLI互換性を維持し、関連テストと全体回帰テストが成功する
  phases:
  - title: 診断契約
    acceptance: []
    steps:
    - description: TASK-048で確定した根因・正常条件を基に、unmounted・stale・mounted-but-unreadable・not-foundの判定契約を定義する
      state: done
      skip_reason: null
      deleted: false
    - description: ~/.whub/runtime/logsの保存形式・上限・ローテーション・秘密情報除外・復旧情報を定義する
      state: done
      skip_reason: null
      deleted: false
    log:
    - '診断契約: unmountedはmount table未登録、staleはmount table不明・sshfs process欠落・root stat失敗/timeout、unreadableはmount
      table/process/root statは正常だがtimeout隔離した子列挙が失敗、okは全probe成功。各healthはdetailとrecoveryを保持する。wflowはProject
      rootとdocs/tasksの存在確認後に同じ子列挙probeを行い、読取不能を不存在から分離する。永続ログは~/.whub/runtime/logs/mount.jsonl、1行1JSON、最大100件。version/project/mountpoint/stage/optionsの安全な名前だけ/result/detail/recoveryを記録し、host/user/identity
      path/remote path/valueは記録しない。書込・rotation失敗はmount処理へ伝播させない。'
    deleted: false
  - title: mount healthとログ
    acceptance: []
    steps:
    - description: mount table・process・root statに加えて、timeout付き子要素列挙または既知probeで実可読性を検査する
      state: done
      skip_reason: null
      deleted: false
    - description: whub mountの事前確認・実行・post-mount検証・失敗段階・復旧候補をCLI表示と保存数制限付き診断ログへ記録する
      state: done
      skip_reason: null
      deleted: false
    log:
    - ResourceHealthへunreadableとrecoveryを追加し、mount table・sshfs process・root statの後に共通の3秒timeout子列挙probeを実行。TASK-048のmount.py固有probeを削除しhealthへ集約。mount
      CLIはprecheck、sshfs、post_mount_probe、cleanupをdetail/recovery付きで表示・記録し、unreadable時はforce
      unmount結果も返す。~/.whub/runtime/logs/mount.jsonlへrelease ID・project・mountpoint・stage・安全なoption名・result/detail/recoveryを最大100件でbest-effort保存し、接続先・user・remote
      path・identity値を除外。
    - '監査補強: sshfs stderrはhost/user/remote path/identity pathを含み得るため永続ログへ保存せず、失敗stageのdetailはsshfs
      command failedへ固定。optionも安全な名前だけを保存する。mount unit testsはwrite_mount_logをautouse
      patchし実operation logを汚染しない。'
    deleted: false
  - title: wflowエラー分類
    acceptance: []
    steps:
    - description: wflowのProject rootとdocs/tasksを探索前に検査し、読取不能をTask不存在と区別したactionable
        errorにする
      state: done
      skip_reason: null
      deleted: false
    - description: 読取可能なTask不存在、Project root読取不能、docs/tasks読取不能の回帰テストを追加する
      state: done
      skip_reason: null
      deleted: false
    log:
    - Project content rootをchdir前に共通子列挙probeし、読取不能をproject resource is unreadableとNetwork
      Volumes権限・remount案内で停止。docs/tasksはiter_task_pathsの探索前に同じprobeを行い、task directory
      is unreadableをTask ID not foundから分離。読取可能な不存在は従来のtask ID not foundを維持。health/mount/log/status/Project
      root/wflowの関連57 tests成功。
    - recoveryはremote Project rootではNetwork Volumes権限とremount、local rootではlocal filesystem
      permissionsへ分岐。docs/tasks単体probeはresource種別を持たないためfilesystem permissionsを主案、mounted
      resourceの場合だけNetwork Volumes/remountを補足する。
    deleted: false
  - title: 統合検証と運用反映
    acceptance: []
    steps:
    - description: 正常・stale・mounted-but-unreadableを再現する自動テストでstatus、mount、wflowのexit
        code・表示・ログを検証する
      state: done
      skip_reason: null
      deleted: false
    - description: uv run pytestの関連テストと全体回帰を通し、既存release運用に従って反映する
      state: done
      skip_reason: null
      deleted: false
    - description: 実mountまたは同等の障害probeで、表示と永続ログから復旧手順を判断できることを確認する
      state: done
      skip_reason: null
      deleted: false
    log:
    - '自動統合検証: healthy/unmounted/stale/unreadable、mount成功・unreadable cleanup、JSONL
      100件rotation・option/stderr redaction、status exit、Project root local/remote recovery、docs/tasks
      unreadableとreadable not foundを検証。focused 59 passed、全361 passed、変更対象Ruff check・format
      check、git diff check成功。release切替・実mountはroot担当のため004-002/003はpending維持。'
    - 全361 tests・focused 59 tests・Ruff/format/diff check成功。commit aa8c380b21cb1bdc0d313fa09b04839196237dc8からwheelをbuildし、SHA256
      254582ab8baf58278b0bdf7e913e44823c94326c992f7b79dc34fe15c5ef0cfc、非editable import、runtime
      release IDを検証。immutable release 0.1.0+gaa8c380bを作成しcurrentへ切替え、PATH上のwhub/wflowが同commitを報告。旧releaseはrollback用に保持。
    - '実地検証: ネットワーク切断後のremote mountsを新releaseのwhub statusがstaleとしてexit nonzero検出。la-ilをwhub
      unmount --force後にwhub mountし、post-mount子列挙probeを通過。最終statusは全remote mount=ok、mount配下AGENTS.md等を列挙可能、wflow
      task --project la-il check/show 002成功。~/.whub/runtime/logs/mount.jsonlの直近3件にversion=0.1.0+gaa8c380b、project=la-il、mountpoint、precheck/sshfs/post_mount_probe、safe
      option名、result/recoveryを確認し、host/user/remote path/identity値なし。失敗時のunreadable表示・Network
      Volumes復旧案内・cleanup logは自動テストで検証。'
    deleted: false
approvals:
- actor: user
acceptance_results:
- acceptance: ACC-001
  status: passed
  evidence:
  - healthのtimeout付きmount子列挙probeがunreadableを返しstatusは非zero、mountはpost-mount unreadable時にforce
    cleanup。該当自動テスト成功、実mount正常probeも成功。
- acceptance: ACC-002
  status: passed
  evidence:
  - Project rootとdocs/tasksを探索前に可読性probeし、unreadableとreadableなTASK not foundを別のWflowErrorへ分類。回帰テスト成功、実la-il
    check/show 002成功。
- acceptance: ACC-003
  status: passed
  evidence:
  - JSONLは最大100件rotation。version/project/mountpoint/stage/safe option名/result/detail/recoveryを保持し、sshfs
    stderrとoption値を永続化しないテスト成功。実logでrelease 0.1.0+gaa8c380bの3段階記録を確認。
- acceptance: ACC-004
  status: passed
  evidence:
  - focused 59 tests、全361 tests、変更対象Ruff/format、git diff check成功。immutable wheelをdeployし、全resource
    status=ok、wflow check/show互換性を実地確認。
change_requests: []
cancellation: null
result:
  summary: mountのstat成功・子列挙不能をunreadableとして検出し、wflowの読取不能をTask不存在から分離。秘密情報を除いた最大100件のmount
    JSONL診断ログと復旧案内を追加。全361 testsと実la-il mount/wflow検証を通し、release 0.1.0+gaa8c380bへ反映した。
