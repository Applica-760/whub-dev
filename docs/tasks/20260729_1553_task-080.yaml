  title: dev API serverのreload監視によるCPU常時消費を解消する
  objective: uvicorn --reloadの監視方式に起因するdev API serverのCPU常時消費を解消し、開発時のreload監視コストを継続的に抑える
  approach:
  - '案A: watchfilesをdev依存に追加し、WatchFilesReload(FSEventsベース)を使わせる'
