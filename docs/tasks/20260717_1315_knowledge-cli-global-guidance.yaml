  objective: Agentがdocs/knowledge.yamlを直接読まず、whub knowledge CLIを通じて関連Knowledgeを確認する運用へ移行する
  approach:
  - Knowledgeへのアクセスは`whub knowledge query`と`whub knowledge check`を使い、YAMLの直接参照をAgentへの標準指示から外す
