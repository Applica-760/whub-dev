schema_version: 1
task:
  id: TASK-066
  state: in_progress
  title: リモート mount 上の AppleDouble 副作用を緩和する
  objective: AppleDouble の sidecar を VS Code の表示から除外し、macOS 側で SSHFS を再帰走査せずリモートホスト上で安全に
    cleanup できる運用または機能を整備する。
  approach:
  - VS Code の AppleDouble 除外は .vscode/settings.json を直接管理し、whub vscode は廃止する。
  - whub remote cleanup-appledouble <PROJECT> は既定で一覧だけを表示し、--apply 指定時だけ検証済みの AppleDouble
    sidecar を削除する。
  - cleanup の探索と削除は SSH 経路でリモートホストへ委譲し、macOS 側で SSHFS を再帰走査しない。
  depends_on:
  - TASK-065
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
