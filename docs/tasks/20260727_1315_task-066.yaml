task:
  id: TASK-066
  state: draft
  title: リモート mount 上の AppleDouble 副作用を緩和する
  objective: AppleDouble の sidecar を VS Code の表示から除外し、macOS 側で SSHFS を再帰走査せずリモートホスト上で安全に
    cleanup できる運用または機能を整備する。
  approach:
  - VS Code の AppleDouble 除外設定を、既存のユーザー設定を壊さない形で whub vscode CLI に組み込む。
  - cleanup の探索と削除は whub run または同等の SSH 経路でリモート側へ委譲し、macOS から mount を繰り返し走査しない。
  - 削除対象は AppleDouble 形式を検証し、dry-run を既定として明示適用時だけ削除する。
  depends_on:
  - TASK-065
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
