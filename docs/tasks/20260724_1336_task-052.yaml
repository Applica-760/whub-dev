task:
  id: TASK-052
  state: in_progress
  title: mount安定化とwhub高コスト要因の対策
  objective: sshfsマウントのフラッピングを止め、whub起因の電力・CPUコストを削減する
  approach:
  - 調査で特定した誤検出unmount・keepalive・レイテンシ増幅・CLI起動コストを対象に、効果とリスクで優先順位を付けて修正する
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance: []
  phases:
  - title: 調査
    acceptance: []
    steps:
    - description: 'mount不安定・バッテリー消費のコスト要因調査（実施済み: 結果はPhase log参照）'
      state: done
      skip_reason: null
      deleted: false
    log:
    - '[観測] ~/.whub/runtime/logs/mount.jsonl(2026-07-24 04:11-04:17 UTC): sshfs成功→post_mount_probeで''directory
      listing timed out after 3s''→unreadable判定→自動force unmount→再mountのフラッピングを記録。実行主体はTASK-048:003で導入したcleanup(commands/mount.py:97-114)'
    - '[観測] sshfsマウント越しのls -A(esn-lab, 19エントリ)は43.6s。同じlsをssh直接実行すると1.4s。ホストomenへのICMP
      RTTは平均212ms/最大446ms/ジッタ大(Tailscale direct接続、リレーではない)'
    - '[観測] FUSE-TのNFSマウントパラメータはvers=4.0,hard,nointr,timeo=10,rdirplus。sshfsは-s(ADR
      0007)+reconnect+ServerAliveInterval=15を3マウントで常時使用(core/remote.py:78-102)'
    - '[観測] 白と確認済み: webappフロントに定期ポーリングなし(手動更新のみ)、launchd/cronにwhub常駐なし、マウントへのSpotlight
      indexing無効、スリープ抑止caffeinateはClaude Code由来、Trend Micro拡張は未有効'
    - '[観測] cli.pyが全コマンドmoduleをトップレベルimportするため、import whub.cliだけで約0.29s(fastapi/uvicorn/pydantic込み)。shell-initの補完生成により新シェル起動毎にも発生。whub
      app dev実行中はrunner.py:176が10Hzビジーポーリング。mount_log.pyは書込毎にファイル全体をread-modify-write(上限100件、実害小)'
    - '[推測] 不安定の主因: probe_directory_readable(core/health.py:31)の3s timeoutが、RTT200-400ms×NFS
      rdirplus(エントリ毎属性取得)×sshfs -s直列化のレイテンシ増幅により恒常的に超過し、健全だが遅いmountをunreadable誤判定→自動force
      unmountしているため'
    - '[推測] バッテリー増の主因: (a)ServerAliveInterval=15×3マウントのkeepaliveでネットワークがアイドルになれない、(b)遅いマウントにFinder/エディタ/エージェントの走査が触れるたびNFSクライアント(hard,timeo=10)が長時間再送。webapp
      runner常駐のアイドル消費は小さい'
    - '[対策案A] unreadable検出時の自動force unmountをやめ警告表示に変更。理由: 誤検出時の実害(健全mountの破壊)を除去しフラッピングを止める。効果大・低リスク。トレードオフ:
      本当に死んだmountの掃除が手動になる'
    - '[対策案B] readdirプローブ(ls -A全列挙)の廃止またはtimeoutを15-30sへ緩和。理由: 直前のstatプローブで生存確認済みであり、全列挙はrdirplus増幅を最も受ける形。トレードオフ:
      TASK-048が対処した異常検出が緩む'
    - '[対策案C] ServerAliveInterval=60へ緩和。理由: keepaliveトラフィックを1/4にしネットワークのアイドル時間を確保。reconnectがあるため切断検出遅延(最大3分)の実害は小さい'
    - '[対策案D] sshfs -s(ADR 0007)の撤廃検討+dcache/entry_timeout等キャッシュ強化。理由: 直列化がレイテンシ増幅の一因。前提:
      ADR 0007の採用経緯の確認が必要'
    - '[対策案E] 常用しないresourceのmount:false化。理由: policy separate_remote_reference_and_executionに整合し、常時マウント数の削減が電力に最も効く。運用側の変更でコード修正不要'
    - '[対策案F] CLIサブコマンドの遅延import化。理由: 軽量コマンド・新シェル起動毎の約0.3s CPU(fastapi/uvicorn import)を解消。安定性とは独立した改善'
    - 調査完了。観測事実・推測・対策案A-Fを本Phase logに記録済み
    - '[対策案G] ホスト単位マウント: 3リソースは全て配下のため、share直下を1回だけsshfsマウントし各workspace_pathはマウント内へのsymlinkにする。理由:
      SSH接続・keepalive・go-nfsv4常駐が3組→1組になり、アイドル時のネットワーク起床は平均5秒毎→keepalive間隔毎に減少。マウント操作・ヘルスプローブも1回化。対策案Cと併用で起床1/12。トレードオフ:
      share配下全体がローカルから見える(アクセス制御が粗くなる)、1接続の障害が全リソースへ同時波及(現状も実質同じ)'
    - '[方針案] mountは仕様変更ではなく常用廃止とする。コマンド・実装は非常口として残し即削除はしないが、既定の運用から外す。理由: 電力(keepalive常時起床・NFS再送)と不安定(プローブ誤判定フラッピング)の根治は常時マウントをやめる以外にない。対策案A-D/G/J(マウント改良系)は非常口の品質問題に格下げ'
    - '[方針案] 複雑なリモート参照基盤(rclone mount/VS Code FileSystemProvider拡張/webappエディタ)は構築しない。リモートの直接編集の実需はIssue
      Log程度と少なく、fetch(既存)と対称の書き戻しコマンドpush(新設)の往復で対応する。ローカルVS Codeで編集でき体験も最良。push側にはハッシュ比較のlost
      update対策とtmp+mvのアトミック書き込みを入れる。普段の参照・操作はagent経由/run/cd(tmux+Vim)に寄せる'
    - '[調査] mount常用廃止の影響範囲: 影響の集約点はservices/project_content.py resolve_project_content_root(remote時にworkspace
      path=マウント先を返す)。経由して壊れるのは(1)wflow task --project <remote>全操作(wflow/commands/task.py:55でchdir)
      (2)whub backlog(services/backlog.py:135) (3)whub knowledge(services/knowledge.py:65)
      (4)services/task.py:27とwebappのtasks/backlog/knowledge router(remote project指定時)。SSHベースのcd/run/fetch/session/codegraph(remote)は無影響。vault/todo/inboxはローカルで無影響。statusはmount列がunmounted表示になるだけで
      exit codeは正常(cosmetic)。vscodeの除外設定はresource.mountフラグ連動のため非常口mount時に除外が効かなくなる(軽微)'
    - '[調査] 危険な副作用: unmount後もmountpointの空ディレクトリが残存し(_unmount_oneはrmdirしない)、resolve_project_content_rootのis_dir()チェックを通過する。この状態でwflow
      task initやbacklog系書き込みを行うと、リモートではなくローカルの死んだmountpoint配下にファイルが作られ、後でmountすると隠れて見えなくなる。mount廃止時はunmounted
      mountpointへの書き込みガードが必須'
    - '[決定] 暫定の軽減措置: mountの仕様(プローブ・自動unmount等)は変えず、生存確認の周期のみ延長する(ServerAliveInterval=15→60目安)。keepalive起床を1/4にして廃止移行までのバッテリー消費を抑える'
    - '[決定] 本方針: mount常用を廃止し、fetch/push案で進める。remoteプロジェクトのtask/backlog/knowledgeはresolve_project_content_rootのchdir差し替えによるcontent-cache+rsync往復方式(wflow本体無改修・リモート導入なし)で維持し、単発編集はfetch/push(新設)で対応。rclone実験(案J)は非常口mountの品質改善として半日タイムボックスで実施のみ、主方針には影響させない'
    deleted: false
