  - grid-template-columnsをdata属性で切替え、折りたたんだ側は細いレール列に置換してトグルのみ残す。折りたたみ状態は@mantine/hooksのuseLocalStorageで永続化する。responsiveな自動縮退は今回のスコープ外とする
