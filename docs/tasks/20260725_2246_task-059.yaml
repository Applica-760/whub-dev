  title: Overviewの左右サイド列を折りたたみ可能にする
  objective: Overviewの3列固定レイアウトで、狭画面やSplit View時に各列が1/3幅へ圧縮され激しく改行される問題を、左右サイド列の手動折りたたみで解消する
