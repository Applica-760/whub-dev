schema_version: 1
task:
  id: TASK-013
  state: completed
  title: Task初期生成と計画更新をCLIで管理する
  objective: Task YAMLの初期生成と計画更新をwflow CLIで検証・原子的に反映し、実行記録の直接編集を不要にする
  approach:
  - レビュー可能なYAML草案を入力にし、task initがTask ID・標準パス・draft状態・初期実行記録を生成する
  - request_plan_change後は、参照番号で指定する論理削除と1 Stepずつの挿入だけが未完了部分の計画を更新し、完了済みの実績を不変にする
  - 削除済みの計画はYAMLに保持し、Web viewで取り消し線として確認できるようにする
  - 計画更新後は再承認を必須にし、既存のTask整合性・Workflow責務境界を保つ
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: TASK-010
plan:
  acceptance:
  - id: ACC-001
    statement: wflow task initが検証済みの草案から標準配置のdraft Taskを生成し、生成後のTaskをcheckできる
  - id: ACC-002
    statement: request_plan_change後のwflow task plan deleteとplan insertが未完了部分だけを原子的に更新し、完了済み実績の改変と不正なPlanを拒否する
  - id: ACC-003
    statement: 削除済み計画はWeb viewで取り消し線として確認でき、計画更新後は再承認を経てTaskを再開できる
  phases:
  - title: 初期生成と計画更新の契約を確定する
    acceptance: []
    steps:
    - description: task initの草案形式、Task ID・標準パスの生成、検証失敗時の非書込みを定義する
      state: done
      skip_reason: null
      deleted: false
    - description: request_plan_change後に参照番号PPPまたはPPP-SSSで論理削除し、削除済み計画をWeb viewで取り消し線表示する契約を定義する
      state: done
      skip_reason: null
      deleted: false
    - description: plan insertが1 Stepを挿入し、--after PPP-SSSでは同Phase内、--after PPPでは直後の挿入フェーズ、指定なしでは計画先頭に置く契約を定義する
      state: done
      skip_reason: null
      deleted: false
    log:
    - '合意済みCLI: wflow task plan delete TASK PPP は指定Phaseを、wflow task plan delete TASK
      PPP-SSS は指定Stepを論理削除する。対象は説明文の完全一致ではなく参照番号で特定する。'
    - 論理削除はYAMLから対象を物理削除しない。削除済みPhase/Stepを保持し、Web viewではMarkdownの取り消し線を想起させる~~…~~相当の表示にする。完了済みStep、Phaseの実行ログ、受け入れ結果は削除・改変を拒否する。
    - '合意済みCLI: wflow task plan insert TASK "Step内容" --after PPP-SSS は対象Step直後の同一Phaseへ1
      Stepを挿入する。例: wflow task plan insert TASK-013 "テストを追加する" --after 003-002。'
    - '合意済みCLI: wflow task plan insert TASK "Step内容" --after PPP は指定Phase直後にタイトル「挿入フェーズ」、指定文を唯一のStepとする新Phaseを挿入する。例:
      wflow task plan insert TASK-013 "最初に調査する" --after 002。'
    - '合意済みCLI: wflow task plan insert TASK "Step内容" は--after省略時に計画先頭へ1 Stepを挿入する。挿入専用YAMLは作らず、Agentとの会話で必要なStep数だけコマンドを実行する。'
    - 操作はrequest_plan_changeでdraftへ戻した後にのみ可能とし、更新後はwflow task checkで検証してapprove_planによる再承認を必須とする。削除と挿入は独立操作として組み合わせる。
    - 'task initはYAML草案を入力にせず、wflow task init "タイトル" "目的" --approach "方針1" --approach
      "方針2" のように位置引数と繰り返し可能な--approachで生成する。Task IDは既存Taskの最大番号+1を自動採番し、標準パスへdraftかつplan:
      nullで原子的に書き出す。'
    - 'plan: nullの新規Taskでwflow task plan insert TASK "最初のStep"を実行した場合は、先頭にタイトル「挿入フェーズ」、指定文を唯一のStepとする最初のPhaseを作る。'
    - PPP／PPP-SSSは削除済み要素を含む現在のYAML配列位置を表す。挿入による後続番号の変更はshowで再確認して扱う。Phaseとそのlogは同じYAMLオブジェクトとして移動するため、順序変更後もログとの対応は保たれる。
    - 論理削除済みPhase/Stepに対するdone、skip、再削除、または挿入先指定はCLIで拒否する。--after未指定のinsertは削除済み要素を除く計画先頭に置く。
    - Task init、論理削除、1 Step挿入、参照番号、Web取り消し線表示、再承認のCLI契約を確定し、詳細をPhase 1ログへ記録した。
    deleted: false
  - title: Task初期生成を実装する
    acceptance: []
    steps:
    - description: 草案を検証してdraft Taskを原子的に生成するserviceを実装する
      state: done
      skip_reason: null
      deleted: false
    - description: wflow task initのCLIと生成・重複・不正草案のテストを実装する
      state: done
      skip_reason: null
      deleted: false
    log:
    - create_taskの自動採番・標準パス・原子的非上書きをServiceテストで確認し、wflow task initの複数--approach入力、生成Task、無効入力時のYAML非生成をCLIテストで確認した。
    deleted: false
  - title: 計画の削除と挿入を実装する
    acceptance: []
    steps:
    - description: plan deleteがPPPまたはPPP-SSSを論理削除し、完了済み実績の削除を拒否するserviceを実装する
      state: done
      skip_reason: null
      deleted: false
    - description: plan insertが1 Stepを挿入し、--after PPPでは挿入フェーズを作るserviceを実装する
      state: done
      skip_reason: null
      deleted: false
    - description: 表示確認用の削除Step
      state: pending
      skip_reason: null
      deleted: true
    - description: plan deleteとplan insertのCLI、Web viewの取り消し線表示、再承認・不正更新・原子性のテストを実装する
      state: done
      skip_reason: null
      deleted: false
    log:
    - wflow task plan delete TASK PPP|PPP-SSS と plan insert TASK "Step内容" --after
      PPP|PPP-SSS をServiceへ接続し、CLIテストでdraft Taskの挿入・論理削除を確認した。Task詳細Web viewは削除済みPhase/Stepを取り消し線・dimmedで表示し、OpenAPI型を再生成してWebビルドを確認した。
    deleted: false
  - title: 運用を検証する
    acceptance: []
    steps:
    - description: initからapprove_plan、request_plan_change、plan delete、plan insert、再承認までの受け入れ検証を実装する
      state: done
      skip_reason: null
      deleted: false
    - description: wflow関連テストとTask整合性検査を実行する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 隔離環境でtask init、plan insert、check、approve_plan、request_plan_change、plan delete、check、再approve_planを順に実行して受け入れフローを確認し、全テストを実行した。
    - complete_taskが論理削除済みpending Stepを一般all_in条件へ含めて拒否したため、削除済みPhase/Stepを除外するactive_steps_all_in条件へ修正した。
    deleted: false
approvals:
- actor: user
- actor: user
- actor: user
acceptance_results:
- acceptance: ACC-001
  status: passed
  evidence:
  - create_task Serviceテストとtask init CLIテストで確認
- acceptance: ACC-002
  status: passed
  evidence:
  - 計画削除・挿入のService/CLIテストと隔離環境の受け入れフローで確認
- acceptance: ACC-003
  status: passed
  evidence:
  - Task 013のWeb viewで論理削除Stepの取り消し線表示を確認
change_requests:
- reason: 計画差し替えを、参照番号による論理削除と1 Stepずつの挿入操作へ具体化するため
- reason: Web viewの論理削除表示を確認するため
cancellation: null
result:
  summary: Task初期生成と計画更新をCLIとWeb viewで管理できるようにした
