schema_version: 1
task:
  id: TASK-057
  state: in_progress
  title: whub runのremote実行PATH解決
  objective: 非対話SSHのPATHに~/.local/binが含まれず、remote hostへ導入済みのツール(wflow・codegraph等)がwhub
    runから解決できない状態を解消し、remote実行の前提を決定的にする
  approach:
  - PATH解決は規約ベースで行い、rcファイルのsourceは実行結果がrc内容に依存するため採らない(bash -lcでも解決しないことを実測済み)。付与箇所はcore/remoteのprelude
    1箇所へ集約し、build_remote_exec_command(whub run)と内部run_ssh_command系の双方で共有する。login shellがrcを読むcd・tmux経路は対象外
  - 対象はhome-serverのみとする。esn-lab-run(supercomputer)は本Taskの想定外とし、セットアップもドキュメントもhost差を扱わない
  - home-serverのlogin shellはbashであることを実測したため、sh -cラップは行わずログインシェル任せの現状を維持する
  - codegraphはnpm-shim(#!/usr/bin/env node)であり、PATH前置きだけではsystem node v18を拾うため、home-serverへnvm
    node v22.22.3をpinしたwrapperを手動配置してから、whub codegraphのnvm preludeを除去する。ホスト側の初期セットアップはwhubの責務としない
  - 全文検索はhome-serverにrgが無いためgrep -rnを正とし、rgのリモート導入は行わない
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
