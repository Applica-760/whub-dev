  state: draft
  title: whub runのremote実行PATH解決
  objective: 非対話SSHのPATHに~/.local/binが含まれず、remote hostへ導入済みのツール(wflow・codegraph等)がwhub
    runから解決できない状態を解消し、remote実行の前提を決定的にする
  approach:
  - 第一候補はbuild_remote_exec_commandで$HOME/.local/binをPATH先頭へ付与する規約ベース。rcファイルのsourceは実行結果がrc内容に依存し非決定的になるため採らない(bash
    -lcでも解決しないことを実測済み)。whub codegraphが内部に持つnvm preludeは、PATHを通す方向へ倒したうえで除去する。host個別に設定したい要求が出た場合のみHostフィールド化を検討し、その判断はTASK-056へ委ねる
