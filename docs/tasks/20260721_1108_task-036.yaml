schema_version: 1
task:
  id: TASK-036
  state: in_progress
  title: remote GUI向けcommand handoff Markdownを追加する
  objective: Mac側whubからLinux GUI側へ複雑なcommandを崩さず渡し、利用者が単一Markdownを開いて最新commandをすぐコピー実行できるようにする
  approach:
  - .whub/handoff/commands.mdをProjectごとの単一handoff fileとし、commandごとのfileは作らない
  - 新規entryをfile先頭へ挿入し、entryとfenced code blockの上下を空行で区切って、最新commandがfileを開いた直後に見えるようにする
  - timestampはZoneInfo("Asia/Tokyo")で生成し、YYYY-MM-DD HH:mm:ss JSTの可読形式でrun ID・目的とともに見出しへ記録する
  - Markdownは人間がcopyして明示実行するhandoffに限定し、自動実行やMarkdownからのcommand解析は行わない
  - mountに依存せずSSH経由で0600 fileへlock付き原子的更新を行い、先頭挿入順・空行・code fence・timezone・既存内容保持を検証する
  depends_on:
  - TASK-030
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: 複雑な複数行commandがremote側commands.mdの最新entryへ内容を崩さず記録される
  - id: ACC-002
    statement: 並行更新でも既存entryを失わず、handoff directoryは0700、fileとlockは0600になる
  - id: ACC-003
    statement: Markdownからcommandを解析・自動実行せず、利用者がcopyして明示実行できる
  - id: ACC-004
    statement: session関連テストとuv run pytest全体が成功する
  phases:
  - title: handoff契約とMarkdown形式を確定する
    acceptance: []
    steps:
    - description: stdin入力、明示Project・run ID・単一行purpose、既存session検証を含むhandoff CLI契約を確定する
      state: done
      skip_reason: null
      deleted: false
    - description: JST timestamp・run ID・purpose・可変長bash code fenceからなる先頭entry形式と改行規則を確定する
      state: done
      skip_reason: null
      deleted: false
    - description: SSH stdin転送、flock、同一directory内の一時fileとos.replace、0700・0600権限の更新契約を確定する
      state: done
      skip_reason: null
      deleted: false
    log:
    - 'CLIは whub session handoff PROJECT RUN_ID --purpose TEXT とし、commandはstdin専用で受け取る。TTY・空白のみ入力、空または改行を含むpurpose、不正または未知runを拒否し、既存runのstateは制限しない。Markdownは
      ## YYYY-MM-DD HH:mm:ss JST | RUN_ID | PURPOSE、空行、可変長bash fence、command、空行の順とし、本文はcode
      fenceに必要な末尾LFがない場合だけ補完する。timestampはMac側でZoneInfo Asia/Tokyoから生成し、payloadをJSONでSSH
      stdinへ送る。remoteでは.whub/handoffを0700、commands.mdと永続lockを0600とし、descriptor確認後にflock内で既存bytesを保持したまま先頭entryを同一directoryのtempfile・fsync・os.replaceで更新する。session
      launcher asset頒布は変更しない。'
    deleted: false
  - title: handoff CLIとremote更新serviceを実装する
    acceptance: []
    steps:
