schema_version: 1
task:
  id: TASK-037
  state: in_progress
  title: Whubの開発ディレクトリと運用ディレクトリを分離する
  objective: WhubのSSoT・Task管理・Agent sessionの入口を担う運用ディレクトリと、CLI・wflow・Web appを開発するcheckoutを分離し、Whub自身を安全に並列開発できる構成を実現する
  approach:
  - を運用上の単一入口とし、SSoT、Task操作、Agent session管理、Project接続を集約する。
  - CLI・wflow・Web appとそのビルド・テスト構成は一体のWhub開発Projectとして運用ディレクトリから分離し、symlink resourceとして接続する。
  - 運用側は開発checkoutのeditable installではなく、mainで検証済みのversionまたはcommitに固定したCLIと対応するWeb
    app artifactを使用する。
  - 開発Projectのworktreeを実装場所として利用し、運用データとユーザー接点を各worktreeへ分散させない。
  depends_on:
  - TASK-033
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-015
    statement: 現在のoperation rootを移動せず、分離前のGit commit hash・日時・source・Task・slides履歴をWhub開発repositoryから参照できる。
  - id: ACC-016
    statement: TASK-037を含む既存Taskの正本はWhub開発Projectだけにあり、operation Projectに移行前Taskが残っていない。
  - id: ACC-017
    statement: operation KnowledgeとWhub開発KnowledgeがProject単位に分割され、両方がwhub knowledge
      checkに成功する。
  - id: ACC-018
    statement: が通常のsymlink resourceとしてWhub開発repositoryへ接続される。
  - id: ACC-019
    statement: operation_projectは設定されたroleとしてoperation_rootへ解決され、workspace-hubという名前に依存する合成resourceと分岐が廃止される。
  - id: ACC-020
    statement: 運用中のwhub/wflow/Web appが外部releaseではなくローカル固定artifactから実行される。
  - id: ACC-021
    statement: Web app、Web API、CLI、wflow、Task Workflow/schemaのrelease整合性が検証されている。
  - id: ACC-022
    statement: 開発checkoutを移動または利用不能にしてもoperation rootから通常の運用操作を実行できる。
  - id: ACC-023
    statement: linked worktreeのbranchコードが運用CLI、Task、Knowledge、manifestを暗黙に変更しない。
  - id: ACC-024
    statement: release切替とrollbackがatomicに実行され、運用SSoTとruntime stateを失わない。
  - id: ACC-025
    statement: 全Phaseの関連test、build、smoke testが成功し、検証コマンドと結果がTASK-037に記録されている。
  phases:
  - title: 分離基準を確定してWhub開発repositoryを複製する
    acceptance:
    - id: ACC-001
      statement: 承認済みpathに完全なGit履歴を持つ独立したWhub開発repositoryが作成され、分離基準commitがoperation
        repositoryと一致する。
    - id: ACC-002
      statement: 現在のoperation rootと運用状態が維持され、runtime・秘密情報・symlink・mount状態が開発cloneへ複製されていない。
    steps:
    - description: 現在のtracked fileと生成物を、operation ProjectのSSoT、Whub release artifact、Whub開発Project、runtime/cache、今回の対象外に分類し、分離後のownerを一意に定義する。
      state: done
      skip_reason: null
      deleted: false
    - description: 現在のを移動せずoperation_rootとして維持し、root直下にwhub
        symlinkを置く目標構成を確定する。
      state: done
      skip_reason: null
      deleted: false
    - description: Whub開発repositoryの物理source pathはユーザー承認済みのとする。2026-07-21のユーザー申告時点では同名directoryは未作成であり、clone実行直前にも未作成であることを再確認する。
      state: done
      skip_reason: null
      deleted: false
    - description: worktree、未commit変更、active Task、現在のHEADを確認し、TASK-034/037を含む必要な変更を分離基準commitへ含めてcleanな状態にする。
      state: done
      skip_reason: null
      deleted: false
    - description: へgit clone --no-hardlinks等で現在のrepositoryを複製し、git
        filter-repo等の履歴書換えを行わず分離前のcommit hash・日時・source・Task・slides履歴を維持する。
      state: pending
      skip_reason: null
      deleted: false
    - description: 開発cloneへはGit管理対象と履歴だけを引き継ぎ、operation固有の.whub runtime、秘密情報、生成symlink、mount状態を複製しない。
      state: pending
      skip_reason: null
      deleted: false
    - description: 両repositoryの分離基準commitが一致し、現在のoperation repositoryが変更前の運用を継続し、開発cloneがuv環境を構築できることを確認する。
      state: pending
      skip_reason: null
      deleted: false
    - description: clone作成結果、両repositoryのpath/HEAD、rollback時に使用する分離基準commitをTASK-037へ記録する。
      state: pending
      skip_reason: null
      deleted: false
    log:
    - '2026-07-21: ユーザー指示により、既存のin_progress Taskは完了扱いにせず、TASK-037を特権的な最優先Taskとして運用・実装分離を優先する。'
    - 'owner分類: operation Project SSoT=.whub/config.toml、外部data_dir 、ignoredのAgent/boot設定。Whub開発Project=現行Git
      tracked内容（src、app、docs/tasks・knowledge、slides、build/dev設定。KnowledgeはPhase 4で再分割）。release
      artifact=現時点では未確立、app/distはignored生成物でありPhase 5のrelease対象。runtime/cache=.whub
      PID、.venv、node_modules、app/dist、.codegraph、pytest/ruff cache。今回対象外=接続先Project実体。vault/projectsの生成symlinkと3件のsshfs
      mountはoperation接続状態としてcloneしない。'
    - '目標構成: をoperation_root兼Agent入口として移動せず維持し、後続Phaseでroot直下whub
      symlinkをへ接続する。'
    - clone先は2026-07-21時点で未作成。親filesystem空き55GiB、Git
      object 118MiB、checkout対象は約1GiBで作成可能。
    - '分離直前: worktreeはのmain 1件、HEAD=5e816a6ea1d24f47ffb3a702701cebbf71ed288b、作業ツリーclean。TASK-022/031/032/037はin_progressのまま維持し、TASK-034取消とTASK-037開始はHEADへ収録済み。'
    - 'owner分類補足: app/node_modulesはignored runtime/cache。一方slides/node_modules配下約5万fileは既にGit
      trackedであるため、生成cacheではなく既存のWhub開発履歴としてcloneへ保持する。operation repositoryからのslides除去はrollback検証後のPhase
      6で扱う。'
    deleted: false
