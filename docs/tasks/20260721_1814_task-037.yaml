schema_version: 1
task:
  id: TASK-037
  state: draft
  title: Whubの開発ディレクトリと運用ディレクトリを分離する
  objective: WhubのSSoT・Task管理・Agent sessionの入口を担う運用ディレクトリと、CLI・wflow・Web appを開発するcheckoutを分離し、Whub自身を安全に並列開発できる構成を実現する
  approach:
  - を運用上の単一入口とし、SSoT、Task操作、Agent session管理、Project接続を集約する。
  - CLI・wflow・Web appとそのビルド・テスト構成は一体のWhub開発Projectとして運用ディレクトリから分離し、symlink resourceとして接続する。
  - 運用側は開発checkoutのeditable installではなく、mainで検証済みのversionまたはcommitに固定したCLIと対応するWeb
    app artifactを使用する。
  - 開発Projectのworktreeを実装場所として利用し、運用データとユーザー接点を各worktreeへ分散させない。
  depends_on:
  - TASK-033
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-015
    statement: 現在のoperation rootを移動せず、分離前のGit commit hash・日時・source・Task・slides履歴をWhub開発repositoryから参照できる。
  - id: ACC-016
    statement: TASK-037を含む既存Taskの正本はWhub開発Projectだけにあり、operation Projectに移行前Taskが残っていない。
  - id: ACC-017
    statement: operation KnowledgeとWhub開発KnowledgeがProject単位に分割され、両方がwhub knowledge
      checkに成功する。
  - id: ACC-018
    statement: が通常のsymlink resourceとしてWhub開発repositoryへ接続される。
  - id: ACC-019
    statement: operation_projectは設定されたroleとしてoperation_rootへ解決され、workspace-hubという名前に依存する合成resourceと分岐が廃止される。
  - id: ACC-020
    statement: 運用中のwhub/wflow/Web appが外部releaseではなくローカル固定artifactから実行される。
  - id: ACC-021
    statement: Web app、Web API、CLI、wflow、Task Workflow/schemaのrelease整合性が検証されている。
  - id: ACC-022
    statement: 開発checkoutを移動または利用不能にしてもoperation rootから通常の運用操作を実行できる。
  - id: ACC-023
    statement: linked worktreeのbranchコードが運用CLI、Task、Knowledge、manifestを暗黙に変更しない。
  - id: ACC-024
    statement: release切替とrollbackがatomicに実行され、運用SSoTとruntime stateを失わない。
  - id: ACC-025
    statement: 全Phaseの関連test、build、smoke testが成功し、検証コマンドと結果がTASK-037に記録されている。
