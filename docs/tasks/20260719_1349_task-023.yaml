  title: 全Projectの残存Markdown TaskをYAMLへ移行する
  objective: manifest配下の全Projectに残る未完了Markdown Taskを、既存の計画・意思決定・実行事実を保持したYAML Taskへ移行し、YAMLを実行記録のSSOTに統一する
  approach:
  - 全Projectを再棚卸しし、docs/tasks/done配下の完了済みMarkdownは凍結履歴として対象外にする
  - 各Markdown Taskはwflow task initで同一Project内にYAMLを新設し、計画・完了Step・実行ログ・残作業を移して検証する
  - 移行元Markdownは削除せずYAMLへの参照を付けた凍結履歴とし、以後の更新先をYAMLだけにする
  depends_on: []
