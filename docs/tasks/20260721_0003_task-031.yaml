  state: in_progress
  title: Whub Overview横断Task依存グラフと詳細表示
  objective: OverviewのTask依存グラフを全Project横断で描画し、ノード選択でページ遷移せずOverview内に選択TaskのフローとStep詳細を表示する
  approach:
  - 全ProjectのTaskをProject単位のエラー隔離付きで返す集約エンドポイントを追加する
  - TaskDependencyGraphのnode idを<project>/<task_id>へ複合化し、依存解決を同一Project内へ限定する
  - Project単位のcompound parentノードでProjectごとにノードを寄せ、ラベルへProject名を前置する
  - TaskDetailPage内のTask詳細をTaskDetailWidgetへ抽出し、TaskFlowGraphWidgetとともにOverviewのBacklog列先頭へ配置する
  - TaskDependencyGraphWidgetを選択コールバック対応にし、OverviewPageで(project, taskId)の選択状態を管理する
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
