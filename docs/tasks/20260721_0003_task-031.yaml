schema_version: 1
task:
  id: TASK-031
  state: in_progress
  title: Whub Overview横断残タスクリストと詳細表示
  objective: Overviewに全Project横断の残タスクリストを置き、行選択でページ遷移せずOverview内に選択TaskのフローとStep詳細を表示する。依存グラフは単一Project表示を維持する
  approach:
  - 全ProjectのTaskをProject単位のエラー隔離付きで返す集約エンドポイントとhookを使う
  - 混在グラフ実装はcommit 949b8b32へ保存したうえでrevertし、依存グラフを単一Project表示へ戻す
  - readyまたはin_progressのTaskだけをProject別グループで並べる横断残タスクWidgetを追加する
  - TaskDetailPage内のTask詳細をTaskDetailWidgetへ抽出し、TaskFlowGraphWidgetとともにOverviewのBacklog列先頭へ配置する
  - Overviewで選択Taskを(project, taskId)として管理し、横断リストと単一Project依存グラフの双方から選択できるようにする
  depends_on: []
  interruption_task_id: null
  interruption_reason: null
  interruption_source_task_id: null
plan:
  acceptance:
  - id: ACC-001
    statement: OverviewのTask依存グラフでノードを選択するとURL遷移せず、同じOverview内のTaskフローと詳細が選択Taskへ切り替わる
  - id: ACC-003
    statement: TasksPageのTask依存グラフでノードを選択すると、従来どおり選択Taskの個別詳細ページへ遷移する
  - id: ACC-004
    statement: TaskDetailPageの既存URL・Taskフロー・Task情報・手順・依存関係・一覧導線が維持される
  - id: ACC-005
    statement: Overviewの残タスクリストが全Projectのreadyまたはin_progressのTaskをProject別グループで表示する
  - id: ACC-006
    statement: 残タスクリストの行を選択するとURL遷移せず、Overview内のTaskフローと詳細が該当Projectの該当Taskへ切り替わる
  - id: ACC-007
    statement: 1つのProjectのTask取得が失敗しても、他Projectの残タスク行が表示され続ける
  - id: ACC-008
    statement: Overviewの依存グラフは選択中Projectのみを描画し、Projectを混在させない
