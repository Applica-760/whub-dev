# workspace-hub CLI サブコマンド設計
# 記法: コマンド名 → 説明 + 対応FR
# CLIエントリポイント: whub

# ── セットアップ系 ──

whub link:                       # FR-6, FR-7
  説明: .whub/manifest.yamlのsymlinkリソースからリンクを作成
  例: whub link
  備考: 正常な既存リンクはスキップし、ルート.gitignoreの自動生成ブロックを更新

whub mount:                      # FR-2
  説明: .whub/manifest.yamlのmountリソースをsshfsでマウント
  例:
    - whub mount                 # auto_mount=trueのホスト
    - whub mount --all           # auto_mount=falseを含む全ホスト
    - whub mount home-server     # 指定ホスト（auto_mount設定を問わない）

whub unmount:                    # FR-2
  説明: マウント解除（ホスト単位）
  例:
    - whub unmount               # 全解除
    - whub unmount home-server   # 指定ホストのみ

# ── 日常操作系 ──

whub status:                     # FR-2
  説明: 全リソースのリンク・マウント状態一覧
  例:
    - whub status
    - whub status --check        # SSHでリモートmountの接続も確認

whub cd:                         # FR-3, FR-6, FR-7
  説明: リソース名で移動（typeに応じてローカルcd or SSH接続）
  動作:
    symlink: ローカルのリソースパスにcd（シェル関数経由）
    mount: リモートホストにSSH接続し、remote_pathにcd
  例:
    - whub cd doc-drill          # ローカルcd → projects/personal/doc-drill/
    - whub cd esn-lab            # SSH → 対象リソースのremote_path
  備考:
    - Tab補完でリソース名を補完
    - ローカルcdはシェル関数が必要（whub shell-initで生成、.zshrcに追記）
    - ローカルcd後に `claude` を起動すれば、プロジェクトのCLAUDE.mdが自動で読み込まれる

# ── ブートストラップ配布系 ──

whub boot:                       # FR-5
  説明: boot=trueの全リソースとworkspace-hubにパッケージ内のエージェント設定を配布
  例: whub boot
  配布戦略:
    - .claude/CLAUDE.md / AGENTS.md / .gitignore: マーカー方式
    - .claude/settings.json: permissions追記、hooksマージ
    - .claude/のその他 / .mcp.json / .codex/: 上書き
  備考: workspace-hub自身も常に配布対象

whub shell-init:
  説明: zsh用のwhub関数と補完設定を出力
  例:
    - source <(whub shell-init)
    - whub shell-init --shell zsh
  備考: ADR-0006 参照

# ── 診断系 ──

whub doctor:
  説明: 未実装（現在はメッセージを表示するスタブ）
  例: whub doctor
