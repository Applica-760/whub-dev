# workspace-hub ディレクトリ構成
# 記法: インデント=親子関係, #=役割コメント
# type: dir / git / symlink / mount のいずれかを記載

# 前提として、このリポ全体を、symlink, mount等をignoreしてGit管理する

.whub/:
  manifest.yaml: file       # 全リソース定義
  state.yaml: file          # 任意・未生成可。リソースの可変状態（現在CLI未接続）
src/whub/:
  _type: dir                # CLIツール（Python / uv + Click + Pydantic）
  boot/: dir                # whub bootの配布資産

projects/:
  research/:
    esn-lab/: mount # 自宅Linuxサーバ　Claude Code等を用いて開発
    esn-lab-run: mount # スパコン　CCやCodexが使えないのでesn-labをCloneして実行するだけ　名前は要検討
    slide: symlink # ``
  LAplust/:
    imitation-learning: mount # 自宅Linuxサーバ　インターン関連
    docs: symlink # 請求書等の事務書類で、クライアントローカルのディレクトリ ``
  personal/:
    doc-drill: symlink # ``
    sns-lab: symlink # ``
    solution-sprints: symlink # ``
    recruit: symlink # ``
    private: mount # 自宅Linuxサーバ

mind/: symlink   # 思考・意思決定・バックログ ``
portfolio/: symlink # ``

docs/:
  _type: dir
  ADR/: dir
  tasks/: dir
  requirements.md: file

.claude/: dir       # AI設定
