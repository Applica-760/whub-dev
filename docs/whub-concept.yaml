schema_version: 0
status: draft
source: docs/whub-concepts.md
description: whub-concepts.mdから単純に構造化できる記述を抜き出した叩き台

concepts:
  project:
    definition: 私が抱えているプロジェクト

  resource:
    definition: projectが持つ任意の接続先データリソース

  remote:
    parent: resource
    definition: リモートのコンピュータに格納されているprojectデータ
    access: sshfs mount
    execution: SSH

  local:
    parent: resource
    definition: このコンピュータにあるprojectデータ
    access: symbolic link

  workspace-hub:
    instance_of: project
    definition: whub自体のproject
    resource: false

  vault:
    definition: 私の固有記述を集約するprivateな貯蔵庫repo
    contains:
      - knowledge
      - derived_documents
      - machine_data
    data_dir_source: .whub/config.toml

  manifest:
    definition: project・resource・接続情報を定義する設定ファイル
    defines:
      - project
      - resource
      - connection

  target:
    definition: resourceを操作するための実行対象
    role: localとremoteの呼び分け

  backlog:
    definition: projectごとの未整理入力・構想・作業候補を置くドキュメント
    project_required: true

  todo:
    definition: 実行可能な単発アクション
    project_required: false

commands:
  status:
    purpose: whubでの接続状態とヘルスチェック

  cd:
    purpose: projectまたはresourceへの移動

  link:
    purpose: symlink resourceをworkspace-hub配下へ接続

  todo:
    purpose: project横断のToDo管理

  boot:
    purpose: whubのAgent設定・Skill・CodeGraph初期化を各resourceへ配布

  backlog:
    purpose: projectごとのbacklogへ未整理メモを追記

  app:
    purpose: ローカルWeb appサーバーの常駐起動と停止

  mount:
    purpose: remote resourceをsshfsでwhubツリーへ接続

  unmount:
    purpose: remote resourceのsshfs接続を解除

  run:
    purpose: remoteでのワンショット実行

  fetch:
    purpose: remoteのファイルをdata_dirのdownloadsへ取得

  vscode:
    purpose: symlinkとmount対象をVS Codeの走査対象から除外する設定を生成

relations:
  project_resource:
    subject: project
    predicate: has_resource
    object: resource
    cardinality: "0..1"

constraints:
  project:
    required_fields:
      - name

  resource:
    parent: project
    required_fields:
      - workspace_path
    path_field_policy: 用途が分かる名前を使う
