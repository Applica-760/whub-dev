schema_version: 1

workflow:
  id: WF-001
  name: task-planning
  initial_state: draft
  terminal_states: [completed, cancelled]

states: [draft, awaiting_approval, in_progress, completed, cancelled]

transitions:
  - trigger: submit_plan
    actor: agent
    from: draft
    to: awaiting_approval
    requires:
      - field: plan
        operator: exists

  - trigger: approve_plan
    actor: user
    from: awaiting_approval
    to: in_progress
    requires:
      - field: plan
        operator: exists
    records:
      - field: approvals
        value:
          plan_revision: $plan.revision
          actor: $actor

  - trigger: request_plan_change
    actor: agent
    from: in_progress
    to: awaiting_approval
    requires:
      - field: $input.reason
        operator: exists
    records:
      - field: change_requests
        value:
          plan_revision: $plan.revision
          reason: $input.reason

  - trigger: complete_task
    actor: agent
    from: in_progress
    to: completed
    requires:
      - field: plan.phases.*.steps.*.state
        operator: all_in
        value: [done, skipped]
      - field: plan.acceptance
        operator: satisfied_if_defined
        result_field: acceptance_results
      - field: plan.phases.*.acceptance
        operator: satisfied_if_defined
        result_field: acceptance_results
    records:
      - field: result
        value: $input.result

  - trigger: cancel_task
    actor: user
    from: [draft, awaiting_approval, in_progress]
    to: cancelled
    requires:
      - field: $input.reason
        operator: exists
    records:
      - field: cancellation
        value:
          reason: $input.reason
          actor: $actor
