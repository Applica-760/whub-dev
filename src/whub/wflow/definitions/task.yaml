schema_version: 1

workflow:
  id: WF-001
  name: task-planning
  initial_state: draft
  terminal_states: [completed, cancelled]

states: [draft, in_progress, paused, completed, cancelled]

transitions:
  - trigger: approve_plan
    actor: user
    from: draft
    to: in_progress
    requires:
      - field: plan
        operator: exists
    records:
      - field: approvals
        value:
          actor: $actor

  - trigger: request_plan_change
    actor: agent
    from: in_progress
    to: draft
    requires:
      - field: $input.reason
        operator: exists
    records:
      - field: change_requests
        value:
          reason: $input.reason

  - trigger: interrupt_task
    actor: agent
    from: in_progress
    to: paused

  - trigger: resume_task
    actor: agent
    from: paused
    to: in_progress

  - trigger: complete_task
    actor: agent
    from: in_progress
    to: completed
    requires:
      - field: $input.result
        operator: exists
      - field: plan.phases.*.steps.*.state
        operator: all_in
        value: [done, skipped]
      - field: plan.acceptance
        operator: satisfied_if_defined
        result_field: acceptance_results
      - field: plan.phases.*.acceptance
        operator: satisfied_if_defined
        result_field: acceptance_results
    records:
      - field: result
        value:
          summary: $input.result

  - trigger: cancel_task
    actor: user
    from: [draft, in_progress, paused]
    to: cancelled
    requires:
      - field: $input.reason
        operator: exists
    records:
      - field: cancellation
        value:
          reason: $input.reason
          actor: $actor
