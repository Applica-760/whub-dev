name: implementer
type: extension

variables:
  # adapterが現在のAgent実行に紐付くwhub worktree登録から解決する。
  # worktreeが未登録、またはTaskとの対応が一意でない場合は実行を拒否する。
  current_worktree:
    source: registered_task_worktree
    fields: [project, task, path]

grants:
  commands:
    prefixes:
      # verification and formatting
      - executable: uv  # uv run pytest *
        arguments:
          - positional: run
          - positional: pytest
      - executable: uv  # uv run ruff check *
        arguments:
          - positional: run
          - positional: ruff
          - positional: check
      - executable: uv  # uv run ruff format *
        arguments:
          - positional: run
          - positional: ruff
          - positional: format
      - executable: npm  # npm test *
        arguments:
          - positional: test
      - executable: npm  # npm run test *
        arguments:
          - positional: run
          - positional: test
      - executable: npm  # npm run format *
        arguments:
          - positional: run
          - positional: format
      - executable: npm  # npm run format:check *
        arguments:
          - positional: run
          - positional: format:check
      # Task lifecycleの変更ではなく、対応Taskの計画とStepだけを操作する。
      - executable: wflow  # wflow task --project $current_worktree.project plan insert $current_worktree.task *
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$current_worktree.project"
          - positional: plan
          - positional: insert
          - positional: "$current_worktree.task"
      - executable: wflow  # wflow task --project $current_worktree.project plan delete $current_worktree.task *
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$current_worktree.project"
          - positional: plan
          - positional: delete
          - positional: "$current_worktree.task"
      - executable: wflow  # wflow task --project $current_worktree.project plan restore $current_worktree.task *
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$current_worktree.project"
          - positional: plan
          - positional: restore
          - positional: "$current_worktree.task"
      - executable: wflow  # wflow task --project $current_worktree.project plan update $current_worktree.task *
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$current_worktree.project"
          - positional: plan
          - positional: update
          - positional: "$current_worktree.task"
      - executable: wflow  # wflow task --project $current_worktree.project done $current_worktree.task *
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$current_worktree.project"
          - positional: done
          - positional: "$current_worktree.task"
    exact: []
  filesystem:
    - scope: current_worktree
      access: write
  network:
    outbound: []
  external_tools: []
