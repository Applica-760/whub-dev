name:
type: base

variables: {}

grants:
  commands:
    # prefixesはargumentsの後ろに任意のargvを許可する。
    prefixes: []
    # exactはexecutableとargumentsだけのargvを許可する。
    exact: []
    # argumentsは順序付きのliteralまたは$variable token列。$variableはvariablesの定義を参照し、文字列結合やshell展開はしない。
    # example --project $current_worktree.project *
    # prefixes:
    #   - executable: example
    #     arguments: [--project, "$current_worktree.project"]
  filesystem:
    # scopeはadapterが具体的なpathへ解決する文脈依存の名前。
    read: []
    write: []
  network:
    policy: deny_all
  approval:
    # requestはadapter固有の承認要求へ変換する。例: Codexではon-request。
    policy: request
    reviewer: user
  # Hubに登録済みの拡張ツールIDだけを指定する。例: [example_tool]
  extension_tools: []
