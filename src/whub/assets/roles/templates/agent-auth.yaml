name:
type: base

variables: {}

grants:
  commands:
    prefixes: []  # argvがこの配列で始まる実行を許可する。
    exact: []     # argv全体がこの配列と一致する実行だけを許可する。
    templates:
      # variablesの値をargvの単独要素として参照する。文字列結合やshell展開はしない。
      - mode: prefix
        argv: ["example", "$current_worktree.project"]
  filesystem:
    # scopeはadapterが具体的なpathへ解決する文脈依存の名前。
    # hub_logical_treeはworkspace-hubでは、Hub直下と直下のdirectory symlink/mountで
    # 到達するProject配下を指す。他のworkspaceでは固有のscope名を定義する。
    - scope: hub_logical_tree
      access: read
  network:
    outbound: []  # 外向き接続先のallowlist。接続を許可しない場合は空にする。
  external_tools:
    - name: example-tool
      transport: stdio
      tools: []  # この外部ツールで許可する固定のtool名。
