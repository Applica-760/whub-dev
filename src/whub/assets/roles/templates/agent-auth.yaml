name:
type: base

variables: {}

grants:
  commands:
    # prefixesはargumentsの後ろに任意のargvを許可する。
    prefixes: []
    # exactはexecutableとargumentsだけのargvを許可する。
    exact: []
    # positionalは順序付きの定数または$variableを一つ持つ。optionはnameと定数または$variableのvalueを不可分に持つ。$variableはvariablesの定義を参照し、文字列結合やshell展開はしない。
    # example --project $current_worktree.project *
    # prefixes:
    #   - executable: example
    #     arguments:
    #       - option:
    #           name: --project
    #           value: "$current_worktree.project"
  filesystem:
    # scopeはadapterが具体的なpathへ解決する文脈依存の名前。
    # hub_logical_treeはworkspace-hubでは、Hub直下と直下のdirectory symlink/mountで
    # 到達するProject配下を指す。他のworkspaceでは固有のscope名を定義する。
    - scope: hub_logical_tree
      access: read
  network:
    outbound: []  # 外向き接続先のallowlist。接続を許可しない場合は空にする。
  external_tools:
    - name: example-tool
      transport: stdio
      tools: []  # この外部ツールで許可する固定のtool名。
