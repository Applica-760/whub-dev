name: base
type: base

grants:
  commands:
    prefixes:
      # 次のコマンドは対象pathの内容、構造、またはmetadataを読める。
      # filesystem権限を定義してからbaseへ追加する。
      # - ["ls"]
      # - ["tree"]
      # - ["stat"]
      # - ["file"]
      # - ["wc"]
      # - ["du"]
      # - ["df"]
      # - ["cat"]
      # - ["head"]
      # - ["tail"]
      # - ["grep"]
      - ["which"]
      - ["uname"]
      - ["ps"]
      - ["git", "status"]
      - ["git", "log"]
      - ["git", "ls-files"]
    exact:
      - ["date"]
      - ["whoami"]
      - ["git", "diff"]
      - ["git", "show"]
      - ["git", "branch"]
      - ["git", "branch", "-a"]
      - ["git", "branch", "-r"]
      - ["git", "branch", "--show-current"]
  filesystem: []
  network: []
  external_tools: []
