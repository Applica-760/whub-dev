name: base
type: base

variables:
  # argv内の値をwhubに登録済みのProject名として検証する。
  # 未登録のProject名は実行を拒否する。
  project:
    source: registered_project

grants:
  commands:
    prefixes:
      # filesystem
      - executable: ls  # ls *
      - executable: tree  # tree *
      - executable: stat  # stat *
      - executable: file  # file *
      - executable: wc  # wc *
      - executable: du  # du *
      - executable: cat  # cat *
      - executable: head  # head *
      - executable: tail  # tail *
      - executable: grep  # grep *

      # system
      - executable: which  # which *
      - executable: uname  # uname *
      - executable: ps  # ps *

      # git
      - executable: git  # git status *
        arguments:
          - positional: status
      - executable: git  # git log *
        arguments:
          - positional: log
      - executable: git  # git ls-files *
        arguments:
          - positional: ls-files

      # whub
      - executable: whub  # whub ls *
        arguments:
          - positional: ls
      - executable: whub  # whub shell-init *
        arguments:
          - positional: shell-init
      - executable: whub  # whub worktree check *
        arguments:
          - positional: worktree
          - positional: check

      # wflow
      - executable: wflow  # wflow check *
        arguments:
          - positional: check
      - executable: wflow  # wflow task --project $project check *
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$project"
          - positional: check
      - executable: wflow  # wflow task --project $project show *
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$project"
          - positional: show

      # system metadata
      # dfは対象pathに限定できず、全mountのmetadataを返す。
      # system metadata権限を定義してからbaseへ追加する。
      # - ["df"]
    exact:
      # system
      - executable: date  # date
      - executable: whoami  # whoami

      # git
      - executable: git  # git diff
        arguments:
          - positional: diff
      - executable: git  # git show
        arguments:
          - positional: show
      - executable: git  # git branch
        arguments:
          - positional: branch
      - executable: git  # git branch -a
        arguments:
          - positional: branch
          - option:
              name: -a
      - executable: git  # git branch -r
        arguments:
          - positional: branch
          - option:
              name: -r
      - executable: git  # git branch --show-current
        arguments:
          - positional: branch
          - option:
              name: --show-current

      # whub
      - executable: whub  # whub todo
        arguments:
          - positional: todo
      - executable: whub  # whub todo -a
        arguments:
          - positional: todo
          - positional: -a
      - executable: wflow  # wflow task --project $project ls
        arguments:
          - positional: task
          - option:
              name: --project
              value: "$project"
          - positional: ls

  filesystem:
    # scopeはadapterが具体的なpathへ解決する。
    read: [hub_logical_tree]
    write: []

  network: {}

  extension_tools:
    - codegraph
