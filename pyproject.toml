[project]
name = "whub"
version = "0.1.0"
description = "workspace-hub CLI: manage local symlinks, remote mounts, and agent rules from a single manifest"
readme = "README.md"
authors = [
    { name = "Applica-760", email = "90311870+Applica-760@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
whub = "whub.cli:main"
wflow = "whub.wflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["src/whub/tests"]
